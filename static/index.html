<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>学术文献检索</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: 'Segoe UI', 'PingFang SC', Roboto, 'Helvetica Neue', sans-serif;
        background: #fff;
        color: #1f2328;
        min-height: 100vh;
    }
    button { font-family: inherit; }
    a { color: #1a5fd0; }

    /* ── 顶栏 ── */
    .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 24px;
        border-bottom: 1px solid #eef0f3;
        position: sticky;
        top: 0;
        background: rgba(255,255,255,.94);
        backdrop-filter: blur(6px);
        z-index: 50;
    }
    .brand { font-size: 16px; font-weight: 600; color: #1a2a6c; }
    .brand span { font-weight: 300; color: #6b7684; }
    .topbar-actions { display: flex; align-items: center; gap: 8px; }
    .btn {
        border: none; border-radius: 8px; cursor: pointer;
        font-size: 13px; padding: 7px 14px; transition: all .18s;
        background: #f2f4f7; color: #344054;
    }
    .btn:hover { background: #e7eaf0; }
    .btn-primary { background: #1a5fd0; color: #fff; }
    .btn-primary:hover { background: #154dab; }
    .btn-ghost { background: transparent; color: #6b7684; border: 1px solid #e3e7ee; }
    .btn-ghost:hover { background: #f6f8fb; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }

    /* 用户徽章 + 登录浮层 */
    .user-menu { position: relative; }
    #btnUser {
        display: flex; align-items: center; gap: 6px;
        border: 1px solid #e3e7ee; background: #fff; color: #344054;
        border-radius: 999px; padding: 6px 14px; font-size: 13px; cursor: pointer;
        max-width: 200px;
    }
    #btnUser:hover { background: #f6f8fb; }
    #btnUser.logged-in { border-color: #bcd0f5; background: #f3f7ff; color: #1a5fd0; }
    #userBadge { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #authDropdown {
        display: none; position: absolute; right: 0; top: calc(100% + 10px);
        width: 300px; background: #fff; border-radius: 14px; padding: 18px 20px;
        box-shadow: 0 16px 40px rgba(0,0,0,.16); border: 1px solid #eef0f3; z-index: 300;
    }
    #authDropdown.open { display: block; }
    #authDropdown h2 { font-size: 17px; color: #1a2a6c; margin-bottom: 6px; }
    #authDropdown .sub { font-size: 13px; color: #8892a4; margin-bottom: 14px; }
    #authDropdown input {
        width: 100%; padding: 10px 12px; border: 1px solid #dde1e8;
        border-radius: 8px; font-size: 13px; margin-bottom: 10px; outline: none;
    }
    #authDropdown input:focus { border-color: #1a5fd0; }
    #authDropdown .btn-primary { width: 100%; padding: 10px; font-size: 14px; }
    .switch-link { text-align: center; margin-top: 12px; font-size: 13px; color: #8892a4; }
    .switch-link a { color: #1a5fd0; cursor: pointer; text-decoration: none; font-weight: 500; }
    .auth-error { color: #e74c5e; font-size: 13px; text-align: center; min-height: 18px; }
    .auth-success { color: #1f9254; font-size: 13px; text-align: center; min-height: 18px; }

    /* ── 搜索区 ── */
    .hero { padding: 64px 24px 12px; text-align: center; }
    .hero.compact { padding: 22px 24px 10px; }
    .hero h1 { font-size: 30px; font-weight: 600; color: #1a2a6c; letter-spacing: .5px; }
    .hero.compact h1 { display: none; }
    .hero .slogan { color: #8892a4; font-size: 14px; margin-top: 10px; }
    .hero.compact .slogan { display: none; }

    .search-wrap { max-width: 720px; margin: 0 auto; }
    .search-box {
        display: flex; align-items: center; gap: 8px;
        border: 2px solid #d8dee9; border-radius: 26px;
        padding: 4px 6px 4px 18px; background: #fff;
        transition: border-color .18s, box-shadow .18s;
    }
    .search-box:focus-within { border-color: #1a5fd0; box-shadow: 0 0 0 4px rgba(26,95,208,.08); }
    #q {
        flex: 1; border: none; outline: none; font-size: 16px;
        padding: 12px 0; background: transparent; color: #1f2328;
    }
    #btnSearch {
        border: none; border-radius: 22px; background: #1a5fd0; color: #fff;
        font-size: 15px; padding: 11px 26px; cursor: pointer; transition: background .18s;
    }
    #btnSearch:hover { background: #154dab; }
    #btnSearch:disabled { background: #9db8e6; cursor: not-allowed; }

    .search-opts {
        display: flex; align-items: center; justify-content: center;
        gap: 14px; flex-wrap: wrap; margin-top: 14px;
        font-size: 13px; color: #6b7684;
    }
    .seg { display: inline-flex; border: 1px solid #e3e7ee; border-radius: 8px; overflow: hidden; }
    .seg button {
        border: none; background: #fff; color: #6b7684;
        padding: 6px 14px; font-size: 13px; cursor: pointer;
    }
    .seg button + button { border-left: 1px solid #e3e7ee; }
    .seg button.active { background: #eef4ff; color: #1a5fd0; font-weight: 600; }

    /* ── 状态条 ── */
    #statusBar { max-width: 860px; margin: 18px auto 0; padding: 0 24px; }
    .status-line {
        display: flex; align-items: center; gap: 10px;
        color: #6b7684; font-size: 13.5px; padding: 10px 0;
    }
    .spinner {
        width: 15px; height: 15px; border: 2px solid #d8dee9;
        border-top-color: #1a5fd0; border-radius: 50%;
        animation: spin .8s linear infinite; flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .query-note {
        background: #f6f8fb; border: 1px solid #eef0f3; border-radius: 9px;
        padding: 9px 14px; font-size: 13px; color: #4a5568; margin: 6px 0;
    }
    .query-note b { color: #1a2a6c; }
    .warn-line { color: #a15c00; font-size: 13px; padding: 5px 0; }

    /* ── 分页 ── */
    .pager {
        display: flex; align-items: center; justify-content: center;
        gap: 10px; flex-wrap: wrap; padding: 26px 0 10px; margin-top: 10px;
        border-top: 1px solid #eef0f3;
    }
    .page-btn {
        border: 1px solid #d8dee9; background: #fff; color: #344054;
        border-radius: 9px; padding: 8px 18px; font-size: 13.5px;
        cursor: pointer; transition: all .16s;
    }
    .page-btn:hover:not(:disabled) { border-color: #1a5fd0; color: #1a5fd0; background: #f7faff; }
    .page-btn:disabled { color: #c2c9d4; cursor: not-allowed; background: #fafbfd; }
    .page-now { font-size: 13.5px; color: #4a5568; }
    .page-now b { color: #1a5fd0; font-size: 15px; }
    .page-hint { font-size: 12.5px; color: #a8b0bc; }

    /* ── 智能体执行轨迹 ── */
    .agent-trace {
        border: 1px solid #eef0f3; border-radius: 12px;
        background: #fafbfd; padding: 12px 16px; margin: 6px 0 4px;
    }
    .agent-trace-head {
        display: flex; align-items: center; gap: 8px;
        font-size: 12.5px; font-weight: 600; color: #6b7684;
        padding-bottom: 8px; margin-bottom: 4px;
        border-bottom: 1px solid #eef0f3;
    }
    .trace-step {
        display: flex; align-items: flex-start; gap: 8px;
        padding: 5px 0; font-size: 13.5px; line-height: 1.6; color: #4a5568;
    }
    .trace-mark {
        flex-shrink: 0; width: 17px; height: 17px; margin-top: 1px;
        display: flex; align-items: center; justify-content: center;
        font-size: 11px; border-radius: 50%;
        background: #eef0f3; color: #8892a4;
    }
    .trace-step.done .trace-mark { background: #e6f5ec; color: #1f9254; }
    .trace-step.warn .trace-mark { background: #fff4e5; color: #a15c00; }
    .trace-step.warn { color: #a15c00; }
    .trace-step.run { color: #1a5fd0; font-weight: 500; }
    .trace-step.run .trace-mark { background: #e8f1ff; color: #1a5fd0; padding: 0; }
    .trace-step .mini-spin {
        width: 11px; height: 11px; border: 2px solid #c9d8f5;
        border-top-color: #1a5fd0; border-radius: 50%;
        animation: spin .8s linear infinite;
    }
    .trace-step .revised {
        font-size: 11.5px; color: #8892a4; margin-left: 6px;
    }

    /* ── 智能体导读 ── */
    .synth-card {
        border: 1px solid #dbe6fb; border-left: 3px solid #1a5fd0;
        background: #f7faff; border-radius: 12px;
        padding: 15px 18px; margin: 14px 0 6px;
    }
    .synth-head {
        display: flex; align-items: center; justify-content: space-between;
        gap: 10px; margin-bottom: 9px;
    }
    .synth-head b { font-size: 14px; color: #1a2a6c; }
    .synth-badge {
        font-size: 11px; color: #5b78b8; background: #e8f1ff;
        border-radius: 5px; padding: 2px 8px; white-space: nowrap;
    }
    .synth-text { font-size: 14px; line-height: 1.85; color: #2b3440; }
    .synth-points { margin: 10px 0 0; padding-left: 2px; list-style: none; }
    .synth-points li {
        font-size: 13.5px; line-height: 1.8; color: #4a5568;
        padding-left: 15px; position: relative;
    }
    .synth-points li::before {
        content: "▸"; position: absolute; left: 0; color: #9db8e6;
    }
    .synth-followups {
        margin-top: 13px; padding-top: 11px; border-top: 1px dashed #dbe6fb;
    }
    .synth-followups .fu-label {
        font-size: 12px; color: #8892a4; margin-bottom: 7px;
    }
    .fu-chip {
        display: inline-block; margin: 0 7px 7px 0;
        border: 1px solid #c9d8f5; background: #fff; color: #1a5fd0;
        border-radius: 999px; padding: 5px 14px; font-size: 13px; cursor: pointer;
        transition: all .16s;
    }
    .fu-chip:hover { background: #eef4ff; border-color: #1a5fd0; }
    .fu-chip::after { content: " ↗"; font-size: 11px; color: #9db8e6; }
    .synth-caveat {
        margin-top: 10px; font-size: 12.5px; color: #8892a4;
        padding-left: 9px; border-left: 2px solid #e3e7ee;
    }
    .err-box {
        background: #fff5f6; border: 1px solid #f6d0d6; color: #b3243a;
        border-radius: 10px; padding: 14px 16px; font-size: 14px; line-height: 1.7;
    }

    /* ── 结果列表 ── */
    #results { max-width: 860px; margin: 8px auto 80px; padding: 0 24px; }
    .result-head {
        display: flex; align-items: baseline; justify-content: space-between;
        gap: 12px; flex-wrap: wrap; padding: 14px 0 10px;
        border-bottom: 1px solid #eef0f3; margin-bottom: 4px;
    }
    .result-count { font-size: 13px; color: #8892a4; }
    .result-tools { display: flex; gap: 8px; }

    .item { border-bottom: 1px solid #f2f4f7; padding: 18px 0; }
    .item-main { cursor: pointer; }
    .item-title {
        font-size: 17px; font-weight: 500; color: #1a5fd0;
        line-height: 1.5; margin-bottom: 6px;
    }
    .item:hover .item-title { text-decoration: underline; }
    .item-meta {
        font-size: 13px; color: #6b7684; line-height: 1.8;
        display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center;
    }
    .item-authors { color: #4a5568; }
    .tag {
        display: inline-block; font-size: 11.5px; padding: 2px 8px;
        border-radius: 5px; background: #f2f4f7; color: #5a6472; white-space: nowrap;
    }
    .tag-src-semantic_scholar { background: #e8f1ff; color: #2b6cb0; }
    .tag-src-openalex { background: #e9f7ef; color: #1f7a45; }
    .tag-oa { background: #e9f7ef; color: #1f7a45; }
    .tag-rel { background: #fff4e5; color: #a15c00; }
    .tag-hot { background: #fdecef; color: #b3243a; cursor: help; }
    .item-snippet {
        font-size: 13.5px; color: #5a6472; line-height: 1.75; margin-top: 8px;
        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
        overflow: hidden;
    }
    .item-toggle {
        margin-top: 7px; font-size: 12.5px; color: #8892a4;
        display: inline-flex; align-items: center; gap: 4px;
    }
    .item.open .item-toggle { color: #1a5fd0; }

    /* 展开区 */
    .item-detail {
        display: none; margin-top: 14px; padding: 16px 18px;
        background: #fafbfd; border: 1px solid #eef0f3; border-radius: 12px;
    }
    .item.open .item-detail { display: block; }
    .detail-loading { color: #8892a4; font-size: 13.5px; display: flex; align-items: center; gap: 8px; }
    .detail-block { margin-bottom: 14px; }
    .detail-block:last-child { margin-bottom: 0; }
    .detail-label {
        font-size: 12px; font-weight: 600; color: #8892a4;
        letter-spacing: .4px; margin-bottom: 6px;
    }
    .detail-text { font-size: 14px; line-height: 1.85; color: #2b3440; white-space: pre-wrap; }
    .kv { display: grid; grid-template-columns: 92px 1fr; gap: 5px 12px; font-size: 13.5px; }
    .kv dt { color: #8892a4; }
    .kv dd { color: #2b3440; word-break: break-all; }
    .detail-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
    .detail-actions .btn { font-size: 13px; }
    .btn-link {
        display: inline-block; text-decoration: none; background: #1a5fd0; color: #fff;
        border-radius: 8px; padding: 7px 14px; font-size: 13px;
    }
    .btn-link:hover { background: #154dab; }
    .btn-link.secondary { background: #e9f7ef; color: #1f7a45; }
    .btn-link.secondary:hover { background: #d6efe0; }
    .btn-link.disabled { background: #f2f4f7; color: #a8b0bc; pointer-events: none; }

    .cite-box {
        margin-top: 12px; padding: 12px 14px; background: #fff;
        border: 1px solid #eef0f3; border-radius: 10px;
    }
    .cite-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .cite-head select {
        padding: 5px 10px; border: 1px solid #dde1e8; border-radius: 7px;
        font-size: 12.5px; outline: none; background: #fff;
    }
    .cite-text {
        font-size: 13px; line-height: 1.8; color: #2b3440;
        background: #fafbfd; border-radius: 8px; padding: 10px 12px;
        word-break: break-word; white-space: pre-wrap; max-height: 190px; overflow: auto;
    }

    /* ── 收藏抽屉 ── */
    .drawer-mask {
        display: none; position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 400;
    }
    .drawer-mask.open { display: block; }
    .drawer {
        position: fixed; top: 0; right: 0; width: 420px; max-width: 92vw; height: 100%;
        background: #fff; box-shadow: -10px 0 40px rgba(0,0,0,.14);
        transform: translateX(100%); transition: transform .25s ease; z-index: 401;
        display: flex; flex-direction: column;
    }
    .drawer.open { transform: translateX(0); }
    .drawer-head {
        display: flex; align-items: center; justify-content: space-between;
        padding: 16px 20px; border-bottom: 1px solid #eef0f3;
    }
    .drawer-head h3 { font-size: 16px; color: #1a2a6c; }
    .drawer-body { flex: 1; overflow-y: auto; padding: 10px 20px 20px; }
    .fav-item {
        display: flex; align-items: flex-start; gap: 10px;
        padding: 12px 0; border-bottom: 1px solid #f2f4f7;
    }
    .fav-item .fav-title { flex: 1; font-size: 14px; line-height: 1.6; color: #2b3440; }
    .fav-item .fav-time { font-size: 12px; color: #a8b0bc; margin-top: 3px; }
    .icon-btn {
        border: none; background: transparent; cursor: pointer;
        color: #b3bdcd; font-size: 14px; padding: 2px 6px; border-radius: 6px;
    }
    .icon-btn:hover { color: #e74c5e; background: #fdecef; }
    .empty-hint { color: #a8b0bc; font-size: 13.5px; text-align: center; padding: 40px 0; line-height: 1.9; }

    /* ── 润色面板 ── */
    #polishPanel {
        display: none; max-width: 860px; margin: 16px auto 0; padding: 16px 20px;
        border: 1px solid #eef0f3; border-radius: 12px; background: #fafbfd;
        margin-left: auto; margin-right: auto;
    }
    #polishPanel .panel-head {
        display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;
    }
    #polishPanel .panel-head span { font-weight: 600; font-size: 15px; color: #1a2a6c; }
    .polish-controls { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
    .polish-controls select {
        padding: 7px 12px; border: 1px solid #dde1e8; border-radius: 8px; font-size: 13px;
    }
    .polish-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .polish-grid textarea {
        width: 100%; padding: 10px 12px; border: 1px solid #dde1e8; border-radius: 8px;
        font-size: 13px; resize: vertical; outline: none; font-family: inherit;
    }
    .result-box {
        width: 100%; min-height: 118px; padding: 10px 12px; border: 1px solid #dde1e8;
        border-radius: 8px; background: #fff; font-size: 13px; line-height: 1.75;
        overflow-y: auto; white-space: pre-wrap;
    }
    .result-box .placeholder { color: #b3bdcd; }

    /* ── 未登录提示弹窗 ── */
    #authPromptModal {
        display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45);
        z-index: 500; align-items: center; justify-content: center;
    }
    #authPromptModal.show { display: flex; }
    #authPromptModal .prompt-content {
        background: #fff; border-radius: 16px; padding: 28px 32px;
        max-width: 380px; width: 90%; text-align: center;
    }
    #authPromptModal .prompt-icon { font-size: 38px; margin-bottom: 12px; }
    #authPromptModal h3 { font-size: 18px; color: #1a2a6c; margin-bottom: 10px; }
    #authPromptModal p { font-size: 14px; color: #6b7684; line-height: 1.7; margin-bottom: 20px; }
    #authPromptModal .prompt-actions { display: flex; gap: 10px; }
    #authPromptModal .prompt-actions button { flex: 1; padding: 10px; border-radius: 10px; font-size: 14px; cursor: pointer; border: none; }
    #authPromptModal .btn-cancel { background: #f2f4f7; color: #6b7684; }
    #authPromptModal .btn-go-login { background: #1a5fd0; color: #fff; }

    .toast {
        position: fixed; left: 50%; bottom: 42px; transform: translateX(-50%) translateY(14px);
        background: #1f2328; color: #fff; padding: 10px 20px; border-radius: 10px;
        font-size: 13.5px; opacity: 0; pointer-events: none; transition: all .22s; z-index: 600;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (max-width: 640px) {
        .hero { padding: 34px 16px 8px; }
        .hero h1 { font-size: 23px; }
        #q { font-size: 15px; }
        #btnSearch { padding: 10px 18px; font-size: 14px; }
        #results, #statusBar, #polishPanel { padding-left: 16px; padding-right: 16px; }
        .polish-grid { grid-template-columns: 1fr; }
        .kv { grid-template-columns: 76px 1fr; }
        .item-title { font-size: 15.5px; }
    }
</style>
</head>
<body>

<header class="topbar">
    <div class="brand">📚 学术检索 <span>· 多源文献</span></div>
    <div class="topbar-actions">
        <button class="btn btn-ghost" id="btnFavDrawer" onclick="openFavDrawer()" style="display:none;">⭐ 收藏</button>
        <button class="btn btn-ghost" onclick="togglePolishPanel()">✍️ 润色</button>
        <div class="user-menu">
            <button id="btnUser" onclick="toggleAuthDropdown(event)">
                <span id="userBadge">👤 未登录</span>
                <span>▾</span>
            </button>
            <div id="authDropdown">
                <h2 id="authTitle">登录 / 注册</h2>
                <p class="sub" id="authSub">登录后可使用收藏与摘要润色</p>
                <div id="authError" class="auth-error"></div>
                <div id="authSuccess" class="auth-success"></div>
                <input type="text" id="authUsername" placeholder="用户名（至少3个字符）" />
                <input type="password" id="authPassword" placeholder="密码" />
                <input type="password" id="authConfirmPassword" placeholder="确认密码" style="display:none;" />
                <input type="text" id="authEmail" placeholder="邮箱（选填）" style="display:none;" />
                <button class="btn btn-primary" id="authSubmitBtn" onclick="handleAuth()">登录</button>
                <div class="switch-link">
                    <span id="authSwitchText">还没有账号？</span>
                    <a id="authSwitchLink" onclick="toggleAuthMode()">注册</a>
                </div>
            </div>
        </div>
        <button class="btn btn-ghost" id="btnLogout" onclick="logout()" style="display:none;">登出</button>
    </div>
</header>

<main>
    <div class="hero" id="hero">
        <h1>学术文献检索</h1>
        <p class="slogan">聚合 Semantic Scholar 与 OpenAlex，中英文文献一次检索</p>
    </div>

    <div class="search-wrap" style="padding:0 24px;">
        <div class="search-box">
            <input id="q" type="search" placeholder="输入关键词、主题或一句自然语言描述…"
                   autocomplete="off" onkeydown="onSearchKey(event)" />
            <button id="btnSearch" onclick="doSearch()">搜索</button>
        </div>
        <div class="search-opts">
            <span>文献来源</span>
            <div class="seg" id="srcSeg">

    journal: 'J', conference: 'C', thesis: 'D', book: 'M', preprint: 'EB/OL',
};

/* ══════════════════════════════════════════════════════════════
   小工具
   ══════════════════════════════════════════════════════════════ */
function $(id) { return document.getElementById(id); }

function escapeHtml(text) {
    if (text === null || text === undefined) return '';
    const d = document.createElement('div');
    d.textContent = String(text);
    return d.innerHTML;
}

/* escapeHtml 不处理引号，不能用于属性上下文 */
function escapeAttr(text) {
    return String(text === null || text === undefined ? '' : text)
        .replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;')
        .replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function toast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(function() { t.classList.remove('show'); }, 1800);
}

async function copyText(text, okMsg) {
    try {
        await navigator.clipboard.writeText(text);
        toast(okMsg || '已复制');
    } catch (e) {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); toast(okMsg || '已复制'); }
        catch (e2) { toast('复制失败，请手动选择'); }
        document.body.removeChild(ta);
    }
}

function downloadBlob(text, filename, mime) {
    const blob = new Blob([text], { type: mime || 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
}

/* ══════════════════════════════════════════════════════════════
   参考引用格式化（GB/T 7714 / APA 7 / BibTeX）
   ══════════════════════════════════════════════════════════════ */
function docMark(p) {
    return '[' + (DOC_MARK[p.docType] || 'J') + ']';
}

/** GB/T 7714 对英文作者要求"姓全大写 + 名缩写"，中文作者原样 */
function gbtAuthor(name) {
    const s = String(name || '').trim();
    if (!s) return '';
    if (/[\u4e00-\u9fff]/.test(s)) return s.replace(/\s+/g, '');
    const parts = s.split(/\s+/).filter(Boolean);
    if (parts.length === 1) return parts[0].toUpperCase();
    const family = parts[parts.length - 1].toUpperCase();
    const initials = parts.slice(0, -1).map(function(w) {
        return w.split('-').map(function(x) {
            return x[0] ? x[0].toUpperCase() : '';
        }).filter(Boolean).join(' ');
    }).join(' ');
    return family + ' ' + initials;
}

/** GB/T 7714-2015：3 个以内全列，超过 3 个列前 3 个 + 等 / et al */
function gbtAuthors(authors) {
    const list = (authors || []).map(gbtAuthor).filter(Boolean);
    if (!list.length) return '佚名';
    if (list.length <= 3) return list.join(', ');
    const isZh = list.some(function(a) { return /[\u4e00-\u9fff]/.test(a); });
    return list.slice(0, 3).join(', ') + (isZh ? ', 等' : ', et al');
}

function formatGBT7714(p, idx) {
    const seg = [gbtAuthors(p.authors) + '.'];
    seg.push((p.title || '') + docMark(p) + '.');
    let src = (p.journal || p.venue || '').trim() || '[刊名不详]';
    if (p.year && p.year !== '未知') src += (src ? ', ' : '') + p.year;
    if (p.volume) src += ', ' + p.volume + (p.issue ? '(' + p.issue + ')' : '');
    if (p.pages) src += ': ' + p.pages;
    if (src) seg.push(src + '.');
    if (p.doi) seg.push('DOI: ' + p.doi + '.');
    const text = seg.join(' ').replace(/\s+/g, ' ').trim();
    return (idx === undefined || idx === null) ? text : '[' + (idx + 1) + '] ' + text;
}

function apaAuthors(authors) {
    const list = (authors || []).filter(Boolean);
    if (!list.length) return '佚名';
    const names = list.map(function(a) {
        const s = String(a).trim();
        if (/[\u4e00-\u9fff]/.test(s)) return s.replace(/\s+/g, '');
        const parts = s.split(/\s+/).filter(Boolean);
        if (parts.length === 1) return parts[0];
        const family = parts[parts.length - 1];
        const initials = parts.slice(0, -1).map(function(w) {
            return (w[0] || '').toUpperCase() + '.';
        }).join(' ');
        return family + ', ' + initials;
    });
    if (names.length === 1) return names[0];
    if (names.length <= 20) return names.slice(0, -1).join(', ') + ', & ' + names[names.length - 1];
    return names.slice(0, 19).join(', ') + ', … ' + names[names.length - 1];
}

function formatAPA(p) {
    const seg = [apaAuthors(p.authors) + ' (' + (p.year && p.year !== '未知' ? p.year : 'n.d.') + ').'];
    seg.push((p.title || '') + '.');
    const src = (p.journal || p.venue || '').trim();
    let tail = '';
    if (src) tail += src;
    if (p.volume) tail += (tail ? ', ' : '') + p.volume + (p.issue ? '(' + p.issue + ')' : '');
    if (p.pages) tail += (tail ? ', ' : '') + p.pages;
    if (tail) seg.push(tail + '.');
    if (p.doi) seg.push('https://doi.org/' + p.doi);
    else if (p.url) seg.push(p.url);
    return seg.join(' ').replace(/\s+/g, ' ').trim();
}

function bibtexKey(p, idx) {
    const first = (p.authors || [])[0] || 'anon';
    const family = String(first).trim().split(/\s+/).pop().replace(/[^A-Za-z\u4e00-\u9fff]/g, '');
    const year = (p.year && p.year !== '未知') ? p.year : 'nd';
    const word = String(p.title || 'paper').split(/\s+/)[0].replace(/[^A-Za-z\u4e00-\u9fff]/g, '');
    return (family || 'anon') + year + (word || '') + (idx === undefined ? '' : idx);
}

function formatBibTeX(p, idx, keyOverride) {
    const type = p.docType === 'conference' ? 'inproceedings'
        : p.docType === 'book' ? 'book'
        : p.docType === 'thesis' ? 'phdthesis'
        : p.docType === 'preprint' ? 'misc' : 'article';
    const key = keyOverride || bibtexKey(p, idx);
    const rows = [];
    const push = function(k, v) { if (v) rows.push('  ' + k + ' = {' + String(v).replace(/[{}]/g, '') + '}'); };
    push('title', p.title);
    push('author', (p.authors || []).join(' and '));
    push('year', (p.year && p.year !== '未知') ? p.year : '');
    push('journal', p.journal || p.venue);
    push('volume', p.volume);
    push('number', p.issue);
    push('pages', String(p.pages || '').replace('-', '--'));
    push('doi', p.doi);
    push('url', p.url);
    return '@' + type + '{' + key + ',' + '\n' + rows.join(',\n') + '\n}';
}

function formatCitation(p, style, idx) {
    if (style === 'apa') return formatAPA(p);
    if (style === 'bibtex') return formatBibTeX(p, idx);
    return formatGBT7714(p, idx);
}

/* ══════════════════════════════════════════════════════════════

   ══════════════════════════════════════════════════════════════ */
function openAuthDropdown() { $('authDropdown').classList.add('open'); }
function closeAuthDropdown() { $('authDropdown').classList.remove('open'); }

function resetAuthForms() {
    $('authError').textContent = '';
    $('authSuccess').textContent = '';
    if (isLoggedIn) return;
    isRegisterMode = true;
    toggleAuthMode();
}

function toggleAuthDropdown(e) {
    if (e) e.stopPropagation();
    if ($('authDropdown').classList.contains('open')) { closeAuthDropdown(); return; }
    resetAuthForms();
    openAuthDropdown();
}

function toggleAuthMode() {
    isRegisterMode = !isRegisterMode;
    const reg = isRegisterMode;
    $('authTitle').textContent = reg ? '创建账号' : '登录 / 注册';
    $('authSub').textContent = reg ? '注册后即可使用收藏与润色' : '登录后可使用收藏与摘要润色';
    $('authSubmitBtn').textContent = reg ? '注册' : '登录';
    $('authSwitchText').textContent = reg ? '已有账号？' : '还没有账号？';
    $('authSwitchLink').textContent = reg ? '去登录' : '注册';
    $('authEmail').style.display = reg ? 'block' : 'none';
    $('authConfirmPassword').style.display = reg ? 'block' : 'none';
    $('authPassword').placeholder = reg ? '密码（8-16位，大小写字母+数字组合）' : '密码';
    $('authError').textContent = '';
    $('authSuccess').textContent = '';
}

async function handleAuth() {
    const username = $('authUsername').value.trim();
    const password = $('authPassword').value.trim();
    const confirmPassword = $('authConfirmPassword').value.trim();
    const email = $('authEmail').value.trim();
    const err = $('authError');
    const okBox = $('authSuccess');
    err.textContent = '';
    okBox.textContent = '';

    if (!username || !password) { err.textContent = '请填写用户名和密码'; return; }
    if (username.length < 3) { err.textContent = '用户名至少3个字符'; return; }
    if (isRegisterMode) {
        if (!/^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,16}$/.test(password)) {
            err.textContent = '密码需为8-16位，包含大小写字母和数字'; return;
        }
        if (password !== confirmPassword) { err.textContent = '两次输入的密码不一致'; return; }
    } else if (password.length < 6) {
        err.textContent = '密码至少6个字符'; return;
    }

    const endpoint = isRegisterMode ? '/api/register' : '/api/login';
    const body = isRegisterMode ? { username: username, password: password, email: email }
                                : { username: username, password: password };
    try {
        const resp = await fetch(endpoint, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body), credentials: 'include',
        });
        const data = await resp.json();
        if (data.success) {
            okBox.textContent = data.message || (isRegisterMode ? '注册成功！请登录' : '登录成功！');
            if (!isRegisterMode) {
                currentUser = data.user;
                isLoggedIn = true;
                $('authPassword').value = '';
                updateUserBadge();
                setTimeout(function() {
                    closeAuthDropdown();
                    renderResults();   // 登录后收藏按钮才可用
                }, 500);
            } else {
                setTimeout(function() {
                    isRegisterMode = false;
                    toggleAuthMode();
                    $('authUsername').value = username;
                    $('authPassword').value = '';
                    $('authEmail').value = '';
                    okBox.textContent = '注册成功，请登录';
                }, 900);
            }
        } else {
            err.textContent = data.error || '操作失败';
        }
    } catch (e) {
        err.textContent = '网络错误，请检查服务是否运行';
    }
}

async function logout() {
    try { await fetch('/api/logout', { method: 'POST', credentials: 'include' }); }
    catch (e) { /* ignore */ }
    isLoggedIn = false;
    currentUser = null;
    updateUserBadge();
    closeAuthDropdown();
    closeFavDrawer();
    renderResults();
    toast('已登出');
}

function updateUserBadge() {
    if (isLoggedIn && currentUser) {
        $('userBadge').textContent = '👤 ' + currentUser.username;
        $('btnUser').classList.add('logged-in');
        $('btnLogout').style.display = 'inline-block';
        $('btnFavDrawer').style.display = 'inline-block';
    } else {
        $('userBadge').textContent = '👤 未登录';
        $('btnUser').classList.remove('logged-in');
        $('btnLogout').style.display = 'none';
        $('btnFavDrawer').style.display = 'none';
        closeAuthDropdown();
    }
}

    $('authPromptModal').classList.add('show');
}

    closeAuthPrompt();

    openAuthDropdown();

/* ══════════════════════════════════════════════════════════════
   搜索
   ══════════════════════════════════════════════════════════════ */
function setSourcePref(v) {
    sourcePref = v;
    Array.prototype.forEach.call($('srcSeg').children, function(b) {
        b.classList.toggle('active', b.dataset.src === v);
    });
    updateSrcHint();
}

async function updateSrcHint() {
    try {
        const resp = await fetch('/api/sources', { credentials: 'include' });
        const data = await resp.json();
        if (!data.success) return;
        const avail = (data.sources || []).filter(function(s) { return s.available; });
        const names = avail.map(function(s) { return s.label; });
        let hint = '当前可用：' + (names.join(' + ') || '无');
        if (sourcePref === 'cn') hint += '（中文检索走 OpenAlex 的 language:zh）';
        $('srcHint').textContent = hint;
    } catch (e) { /* 提示而已，失败就不显示 */ }
}

function onSearchKey(e) {
    if (e.key === 'Enter') { e.preventDefault(); doSearch(); }
}

/* ── 智能体执行轨迹 ──────────────────────────────────────────
   把 agent_step 事件渲染成一条时间线。这既是"进度可见"，
   也是让用户看懂"它在干什么"——智能体的动作不该是黑盒。 */
const PHASE_LABEL = {
    plan: '规划', search: '检索', observe: '评估',
    replan: '调整策略', rank: '排序', synthesize: '归纳',
};
const MARK = { run: '', done: '✓', warn: '!' };

function resetTrace() {
    $('statusBar').innerHTML =
        '<div class="agent-trace" id="agentTrace">' +
        '<div class="agent-trace-head">🤖 智能体执行过程</div>' +
        '</div>';
}

function addTrace(phase, text, status) {
    const trace = $('agentTrace');
    if (!trace) return;
    const el = document.createElement('div');
    el.className = 'trace-step ' + (status || 'run');
    const label = PHASE_LABEL[phase] || phase;
    el.innerHTML =
        '<span class="trace-mark">' +
            (status === 'run' ? '<span class="mini-spin"></span>' : (MARK[status] || '')) +
        '</span>' +
        '<span><b>' + escapeHtml(label) + '</b>　' + escapeHtml(text) + '</span>';
    trace.appendChild(el);
}

/* 同一阶段重复出现时（例如重搜），把上一条从"进行中"收尾，避免一直转圈 */
function finishRunningSteps() {
    document.querySelectorAll('#agentTrace .trace-step.run').forEach(function(el) {
        el.classList.remove('run');
        el.classList.add('done');
        const mark = el.querySelector('.trace-mark');
        if (mark) mark.textContent = '✓';
    });
}

function renderSynthesis(s) {
    if (!s || !s.summary) return;
    const points = (s.highlights || [])
        .map(function(h) { return '<li>' + escapeHtml(h) + '</li>'; }).join('');
    const chips = (s.followups || [])
        .map(function(f, i) {
            return '<button class="fu-chip" data-fu="' + i + '">' + escapeHtml(f) + '</button>';
        }).join('');

    const html =
        '<div class="synth-card" id="synthCard">' +
            '<div class="synth-head">' +
                '<b>🧠 智能体导读</b>' +
                '<span class="synth-badge">AI 归纳，内容来自上方检索结果</span>' +
            '</div>' +
            '<div class="synth-text">' + escapeHtml(s.summary) + '</div>' +
            (points ? '<ul class="synth-points">' + points + '</ul>' : '') +
            (chips ? '<div class="synth-followups">' +
                        '<div class="fu-label">可以接着搜：</div>' + chips +
                     '</div>' : '') +
            (s.caveat ? '<div class="synth-caveat">⚠️ ' + escapeHtml(s.caveat) + '</div>' : '') +
        '</div>';

    const host = $('results');
    const first = host.firstChild;
    if (first) host.insertAdjacentHTML('beforebegin', html);
    else host.innerHTML = html;

    // 追问建议记下来，点击时按索引取（不要拼进属性里）
    synthFollowups = s.followups || [];
}

let synthFollowups = [];

/* 分页状态：把上一页跳转用的信息映射到 data-idx，避免把检索词拼进属性 */
const PAGE_SIZE = 20;
const pageState = { page: 1, query: '' };

$('results').addEventListener('click', function(e) {
    const chip = e.target.closest('.fu-chip');
    if (!chip) return;
    const q = synthFollowups[Number(chip.dataset.fu)];
    if (!q) return;
    $('q').value = q;
    doSearch();
});

async function doSearch(queryOverride, opts) {
    if (searching) return;
    opts = opts || {};
    const q = (queryOverride || $('q').value).trim();
    if (!q) { $('q').focus(); toast('请输入检索内容'); return; }

    const page = Math.max(1, opts.page || 1);
    const keepSynth = !!opts.keepSynthesis;
    pageState.page = page;

    searching = true;
    $('btnSearch').disabled = true;
    $('hero').classList.add('compact');
    $('results').innerHTML = '';
    if (!keepSynth) synthFollowups = [];
    detailCacheClear();
    resetTrace();

    const t0 = Date.now();
    const timer = setInterval(function() {
        const el = $('traceElapsed');
        if (el) el.textContent = '已等待 ' + ((Date.now() - t0) / 1000).toFixed(1) + 's';
    }, 100);

    try {
        const resp = await fetch('/api/search', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                message: q,
                source_pref: sourcePref,
                per_page: PAGE_SIZE,
                offset: (page - 1) * PAGE_SIZE,
                synthesis: !keepSynth,
            }),
            credentials: 'include',
        });
        if (!resp.body) throw new Error('当前浏览器不支持流式读取');

        const reader = resp.body.getReader();
        const decoder = new TextDecoder('utf-8');
        let buffer = '';

        while (true) {
            const r = await reader.read();
            if (r.done) break;
            buffer += decoder.decode(r.value, { stream: true });
            const events = buffer.split('\n\n');
            buffer = events.pop() || '';

            for (const evt of events) {
                const line = evt.split('\n').find(function(l) { return l.indexOf('data: ') === 0; });
                if (!line) continue;
                let data;
                try { data = JSON.parse(line.slice(6)); } catch (e) { continue; }

                if (data.type === 'agent_step') {
                    addTrace(data.phase, data.text, data.status);
                } else if (data.type === 'query') {
                    if (data.revised) {
                        // 智能体换了检索词重搜 —— 在轨迹里如实标出来
                        finishRunningSteps();
                        addTrace('replan', '改用「' + data.query + '」', 'done');
                    }
                    addTrace('query', '检索词：' + data.query +
                        '（' + ({ all: '全部', cn: '仅中文', en: '仅英文' }[data.source] || data.source) + '）',
                        'done');
                } else if (data.type === 'synthesis') {
                    renderSynthesis(data);
                } else if (data.type === 'papers') {
                    lastPapers = data.papers || [];
                    renderResults();
                } else if (data.type === 'warn') {
                    const w = document.createElement('div');
                    w.className = 'warn-line';
                    w.textContent = '⚠️ ' + data.text;
                    $('statusBar').appendChild(w);
                } else if (data.type === 'result') {
                    pageState.page = data.page || 1;
                    pageState.query = data.query || pageState.query;
                    if (!lastPapers.length) {
                        renderEmpty(data.query);
                    } else {
                        renderResultHead(data);
                    }
                    renderPager(data);
                } else if (data.type === 'error') {
                    renderError(data);
                }
            }
        }
    } catch (e) {
        renderError({ message: '请求失败：' + e.message });
    }

    clearInterval(timer);
    // 收尾：把还在转圈的步骤标成完成，并显示总耗时
    finishRunningSteps();
    const trace = $('agentTrace');
    if (trace) {
        const total = ((Date.now() - t0) / 1000).toFixed(1);
        const done = document.createElement('div');
        done.className = 'agent-trace-head';
        done.style.borderBottom = 'none';
        done.style.paddingTop = '8px';
        done.style.marginTop = '4px';
        done.style.borderTop = '1px solid #eef0f3';
        done.innerHTML = '<span id="traceElapsed" style="font-weight:400;">' +
            '完成，共耗时 ' + total + 's</span>';
        trace.appendChild(done);
    }
    searching = false;
    $('btnSearch').disabled = false;
}

function detailCacheClear() {
    Object.keys(detailCache).forEach(function(k) { delete detailCache[k]; });
}

function renderError(data) {
    const box = document.createElement('div');
    box.className = 'err-box';
    let html = '❌ ' + escapeHtml(data.message || '检索失败');
    if (data.suggestion) html += '<br /><span style="color:#8892a4;">' + escapeHtml(data.suggestion) + '</span>';
    box.innerHTML = html;
    $('results').appendChild(box);
}

function renderEmpty(query) {
    $('results').innerHTML =
        '<div class="empty-hint">没有找到与「' + escapeHtml(query) + '」相关的文献。<br />' +
        '试试换用更通用的关键词，或切换文献来源范围。</div>';
}

function renderResultHead(data) {
    let html = '<div class="result-head"><div class="result-count">' +
        '找到 <b>' + data.total + '</b> 篇' +
        (data.page ? '　第 ' + data.page + ' 页' : '') +
        (data.sources && data.sources.length ? '　来源：' + escapeHtml(data.sources.join('、')) : '') +
        (data.filtered_out ? '　（已过滤 ' + data.filtered_out + ' 篇低相关度结果）' : '') +
        '</div><div class="result-tools">' +
        '<button class="btn" onclick="copyAllCitations()">📋 复制全部引用</button>' +
        '<button class="btn" onclick="exportPapersCsv()">⬇️ 导出 CSV</button>' +
        '</div></div>';
    const existing = $('results').querySelector('.result-head');
    if (existing) existing.outerHTML = html;
    else $('results').insertAdjacentHTML('afterbegin', html);
}

/* ── 分页 ────────────────────────────────────────────────────
   翻页重新请求 /api/search（带 offset），但不再走智能体的规划/归纳那两步，
   所以比第一次搜索快很多；各页结果在服务端有缓存，来回翻几乎零成本。 */
function renderPager(data) {
    const old = $('pager');
    if (old) old.remove();

    const hasPrev = data.page > 1;
    const hasNext = !!data.has_more;
    // 一页都没有时不用显示分页条
    if (!hasPrev && !hasNext) return;

    const el = document.createElement('div');
    el.className = 'pager';
    el.id = 'pager';
    el.innerHTML =
        '<button class="page-btn" data-page="prev"' + (hasPrev ? '' : ' disabled') + '>‹ 上一页</button>' +
        '<span class="page-now">第 <b>' + data.page + '</b> 页</span>' +
        '<button class="page-btn" data-page="next"' + (hasNext ? '' : ' disabled') + '>下一页 ›</button>' +
        '<span class="page-hint">本页 ' + data.total + ' 篇' +
            (hasNext ? '' : '　已是最后一页') + '</span>';

    const host = $('results');
    host.appendChild(el);
    el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

$('results').addEventListener('click', function(e) {
    const btn = e.target.closest('.page-btn');
    if (!btn || btn.disabled) return;
    const dir = btn.dataset.page;
    const next = dir === 'next' ? pageState.page + 1 : pageState.page - 1;
    if (next < 1) return;
    // 翻页时用"最终生效的检索词"，不是用户最初输入的那句
    doSearch(pageState.query || $('q').value.trim(), { page: next, keepSynthesis: true });
});

function renderResults() {
    const head = $('results').querySelector('.result-head');
    if (!lastPapers.length) return;
    let html = head ? head.outerHTML : '';
    lastPapers.forEach(function(p, i) {
        html += resultItemHtml(p, i);
    });
    $('results').innerHTML = html;
    $('results').querySelectorAll('.item').forEach(function(el) {
        if (el.dataset.restoreOpen === '1') el.classList.add('open');
    });
}

function resultItemHtml(p, idx) {
    const authors = (p.authors || []).slice(0, 4).join('、') +
        ((p.authors || []).length > 4 ? ' 等' : '');
    const meta = [];
    if (p.year && p.year !== '未知') meta.push(escapeHtml(p.year));
    const venue = (p.journal || p.venue || '').trim();
    if (venue) meta.push(escapeHtml(venue));
    if (p.citationCount) meta.push('被引 ' + p.citationCount);
    const snippet = (p.abstract || '').replace(/^暂无摘要$/, '');
    const badges = [];
    badges.push('<span class="tag tag-src-' + escapeAttr(p.source || '') + '">' +
        escapeHtml(p.sourceLabel || p.source || '') + '</span>');
    if (p.openAccessPdf) badges.push('<span class="tag tag-oa">开放获取·有全文</span>');
    else if (p.isOa) badges.push('<span class="tag tag-oa">开放获取</span>');
    if (typeof p.relevance === 'number') badges.push('<span class="tag tag-rel">相关度 ' + p.relevance + '</span>');
    // 排序用的综合分：把构成也写进 title，鼠标悬停能看到"为什么它排前面"
    if (typeof p.impactScore === 'number') {
        const why = '排序分 ' + Math.round(p.impactScore * 100) +
            '　= 被引 ' + Math.round(p.citationScore * 100) + '×0.65 + 年份 ' +
            Math.round(p.recencyScore * 100) + '×0.35';
        badges.push('<span class="tag tag-hot" title="' + escapeAttr(why) + '">🔥 ' +
            Math.round(p.impactScore * 100) + '</span>');
    }

    return '' +
    '<div class="item" data-idx="' + idx + '" data-pid="' + escapeAttr(p.id || '') + '">' +
      '<div class="item-main" onclick="toggleDetail(this.parentNode)">' +
        '<div class="item-title">' + (idx + 1) + '. ' + escapeHtml(p.title || '未知标题') + '</div>' +
        '<div class="item-meta">' +
          (authors ? '<span class="item-authors">' + escapeHtml(authors) + '</span>' : '') +
          meta.map(function(m) { return '<span>' + m + '</span>'; }).join('') +
          badges.join('') +
        '</div>' +
        (snippet ? '<div class="item-snippet">' + escapeHtml(snippet) + '</div>' : '') +
        '<div class="item-toggle">▾ 点击展开详细信息</div>' +
      '</div>' +
      '<div class="item-detail"></div>' +
    '</div>';
}

/* ══════════════════════════════════════════════════════════════
   展开详情
   ══════════════════════════════════════════════════════════════ */
async function toggleDetail(itemEl) {
    if (!itemEl) return;
    const open = itemEl.classList.toggle('open');
    itemEl.dataset.restoreOpen = open ? '1' : '0';
    const toggle = itemEl.querySelector('.item-toggle');
    if (toggle) toggle.textContent = open ? '▴ 收起' : '▾ 点击展开详细信息';
    if (!open) return;

    const idx = Number(itemEl.dataset.idx);
    const paper = lastPapers[idx];
    if (!paper) return;
    const box = itemEl.querySelector('.item-detail');
    if (box.dataset.filled === '1') return;

    const pid = paper.id || '';
    if (detailCache[pid]) { fillDetail(box, paper, detailCache[pid]); return; }

    box.innerHTML = '<div class="detail-loading"><span class="spinner"></span>正在获取详细信息…</div>';
    try {
        const resp = await fetch('/api/paper/' + encodeURIComponent(pid), { credentials: 'include' });
        const data = await resp.json();
        if (!data.success) {
            box.innerHTML = '<div class="detail-loading" style="color:#b3243a;">' +
                escapeHtml(data.error || '获取详情失败') + '</div>';
            return;
        }
        detailCache[pid] = data.paper;
        fillDetail(box, paper, data.paper);
    } catch (e) {
        box.innerHTML = '<div class="detail-loading" style="color:#b3243a;">网络错误：' +
            escapeHtml(e.message) + '</div>';
    }
}

function fillDetail(box, paper, full) {
    const p = Object.assign({}, paper, full || {});
    const rows = [];
    const add = function(k, v) { if (v) rows.push('<dt>' + k + '</dt><dd>' + escapeHtml(v) + '</dd>'); };

    add('作者', (p.authors || []).join('、'));
    add('年份', (p.year && p.year !== '未知') ? p.year : '');
    add('期刊/会议', p.journal || p.venue);
    add('类型', p.docType);
    if (p.volume || p.issue || p.pages) {
        add('卷期页码', [p.volume, p.issue ? '(' + p.issue + ')' : '', p.pages ? ': ' + p.pages : ''].join(''));
    }
    add('被引次数', p.citationCount ? String(p.citationCount) : '');
    add('参考文献数', p.referenceCount ? String(p.referenceCount) : '');
    if (typeof p.impactScore === 'number') {
        add('排序分', Math.round(p.impactScore * 100) +
            '（被引 ' + Math.round(p.citationScore * 100) +
            ' ×0.65 + 年份 ' + Math.round(p.recencyScore * 100) + ' ×0.35）');
    }
    add('DOI', p.doi);
    add('学科', (p.fieldsOfStudy || []).join('、'));
    add('来源', p.sourceLabel || p.source);

    let html = '';
    if (p.tldr) {
        html += '<div class="detail-block"><div class="detail-label">一句话摘要</div>' +
            '<div class="detail-text">' + escapeHtml(p.tldr) + '</div></div>';
    }
    html += '<div class="detail-block"><div class="detail-label">摘要</div>' +
        '<div class="detail-text">' + escapeHtml(p.abstract || '该数据源未提供摘要') + '</div></div>';
    if (rows.length) {
        html += '<div class="detail-block"><dl class="kv">' + rows.join('') + '</dl></div>';
    }

    const pageLabel = /doi\.org/.test(p.url || '') ? '阅读（DOI 页）' : '阅读（来源页）';
    const pdfHref = p.id ? '/api/paper/' + encodeURIComponent(p.id) + '/pdf' : (p.openAccessPdf || '');
    const idx = Number(box.closest('.item').dataset.idx);
    html += '<div class="detail-actions">' +
        (p.url ? '<a class="btn-link" href="' + escapeAttr(p.url) + '" target="_blank" rel="noopener">🔗 ' + pageLabel + '</a>' : '') +
        (p.openAccessPdf
            ? '<a class="btn-link secondary" href="' + escapeAttr(pdfHref) + '">⬇️ 下载全文 PDF</a>'
            : '<span class="btn-link disabled">无全文直链' + (p.isOa ? '（可在来源页查看）' : '（非开放获取）') + '</span>') +
        '<button class="btn" data-act="fav" data-idx="' + idx + '">' +
            (favIds.has(p.id) ? '★ 已收藏' : '☆ 收藏') + '</button>' +
        '<button class="btn" data-act="polish" data-idx="' + idx + '">✍️ 润色这条摘要</button>' +
        '</div>';

    html += '<div class="cite-box">' +
        '<div class="cite-head"><span class="detail-label" style="margin:0;">参考文献格式</span>' +
        '<select data-act="cite">' +
            '<option value="gbt"' + (citeStyle === 'gbt' ? ' selected' : '') + '>GB/T 7714</option>' +
            '<option value="apa"' + (citeStyle === 'apa' ? ' selected' : '') + '>APA 第 7 版</option>' +
            '<option value="bibtex"' + (citeStyle === 'bibtex' ? ' selected' : '') + '>BibTeX</option>' +
        '</select>' +
        '<button class="btn" data-act="copycite" data-idx="' + idx + '">📋 复制</button>' +
        '</div>' +
        '<div class="cite-text">' + escapeHtml(formatCitation(p, citeStyle, idx)) + '</div>' +
        '</div>';

    box.innerHTML = html;
    box.dataset.filled = '1';
}

/* 详情区内的按钮走事件委托：用 data-idx 索引，避免把论文 id 拼进 onclick
   （id 里带引号的话会直接把属性截断，和之前踩过的坑是同一类）。 */
function onDetailClick(e) {
    const el = e.target.closest('[data-act]');
    if (!el) return;
    const act = el.dataset.act;
    const idx = Number(el.dataset.idx);
    const paper = lastPapers[idx];
    if (!paper) return;
    if (act === 'fav') {
        toggleFavorite(idx, el);
    } else if (act === 'polish') {
        useAbstractForPolish(idx);
    } else if (act === 'copycite') {
        copyOneCite(idx);
    }
}

function onDetailChange(e) {
    const sel = e.target.closest('[data-act="cite"]');
    if (!sel) return;
    citeStyle = sel.value;
    try { localStorage.setItem('citeStyle', citeStyle); } catch (e2) { /* 隐私模式 */ }
    document.querySelectorAll('.item.open').forEach(function(item) {
        const box = item.querySelector('.item-detail');
        const i = Number(item.dataset.idx);
        const p = lastPapers[i];
        if (box && p && box.dataset.filled === '1') fillDetail(box, p, detailCache[p.id] || {});
    });
}

function copyOneCite(idx) {
    const p = lastPapers[idx];
    if (!p) return;
    copyText(formatCitation(Object.assign({}, p, detailCache[p.id] || {}), citeStyle, idx), '已复制引用');
}

function copyAllCitations() {
    if (!lastPapers.length) { toast('还没有检索结果'); return; }
    const text = lastPapers.map(function(p, i) { return formatCitation(p, citeStyle, i); }).join('\n\n');
    copyText(text, '已复制 ' + lastPapers.length + ' 条引用');
}

/* ══════════════════════════════════════════════════════════════
   CSV 导出
   ══════════════════════════════════════════════════════════════ */
function csvCell(v) {
    return '"' + String(v === null || v === undefined ? '' : v).replace(/"/g, '""') + '"';
}

function exportPapersCsv() {
    if (!lastPapers.length) { toast('还没有检索结果'); return; }
    const head = ['序号', '标题', '作者', '年份', '期刊/会议', '来源', '语种',
                  '相关度', '被引', '卷', '期', '页码', 'DOI', '全文可得', '原文链接', '全文链接'];
    const rows = lastPapers.map(function(p, i) {
        return [i + 1, p.title, (p.authors || []).join('、'), p.year,
                p.journal || p.venue, p.sourceLabel, p.language,
                p.relevance, p.citationCount, p.volume, p.issue, p.pages,
                p.doi, p.openAccessPdf ? '是' : '否', p.url, p.openAccessPdf
        ].map(csvCell).join(',');
    });
    // \ufeff 是 BOM：不加 Excel 打开中文会乱码
    downloadBlob('\ufeff' + head.map(csvCell).join(',') + '\r\n' + rows.join('\r\n'),
                 '检索结果.csv', 'text/csv;charset=utf-8');
    toast('已导出 CSV');
}

/* ══════════════════════════════════════════════════════════════
   收藏
   ══════════════════════════════════════════════════════════════ */
const favIds = new Set();

async function loadFavoriteIds() {
    favIds.clear();
    if (!isLoggedIn) return;
    try {
        const resp = await fetch('/api/favorites', { credentials: 'include' });
        const data = await resp.json();
        if (data.success) (data.favorites || []).forEach(function(f) { favIds.add(f.paper_id); });
    } catch (e) { /* ignore */ }
}

async function toggleFavorite(idx, btn) {
    if (requireLogin('收藏功能')) return;
    const paper = lastPapers[idx];
    if (!paper) return;
    const pid = paper.id;
    if (!pid) { toast('缺少论文标识，无法收藏'); return; }

    const detail = detailCache[pid] || {};
    const title = paper.title || detail.title || '';
    const authors = (paper.authors || detail.authors || []).join('、');
    const year = paper.year || detail.year || '';

    const faved = favIds.has(pid);
    try {
        let resp;
        if (faved) {
            resp = await fetch('/api/favorites/' + encodeURIComponent(pid), {
                method: 'DELETE', credentials: 'include',
            });
        } else {
            resp = await fetch('/api/favorites', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ paper_id: pid, paper_title: title, authors: authors, year: year }),
                credentials: 'include',
            });
        }
        const data = await resp.json();
        if (!data.success) { toast(data.error || '操作失败'); return; }
        if (faved) { favIds.delete(pid); } else { favIds.add(pid); }
        if (btn) btn.textContent = favIds.has(pid) ? '★ 已收藏' : '☆ 收藏';
        toast(faved ? '已取消收藏' : '已收藏');
    } catch (e) {
        toast('操作失败：' + e.message);
    }
}

function openFavDrawer() {
    if (requireLogin('收藏功能')) return;
    $('favMask').classList.add('open');
    $('favDrawer').classList.add('open');
    renderFavorites();
}

function closeFavDrawer() {
    $('favMask').classList.remove('open');
    $('favDrawer').classList.remove('open');
}

async function renderFavorites() {
    const body = $('favBody');
    body.innerHTML = '<div class="empty-hint">加载中…</div>';
    try {
        const resp = await fetch('/api/favorites', { credentials: 'include' });
        const data = await resp.json();
        const list = (data.favorites || []);
        if (!list.length) {
            body.innerHTML = '<div class="empty-hint">还没有收藏。<br />展开检索结果的详情，点「☆ 收藏」即可。</div>';
            return;
        }
        body.innerHTML = list.map(function(f) {
            const meta = [f.authors, f.year].filter(Boolean).join('　');
            return '<div class="fav-item">' +
                '<div><div class="fav-title">' + escapeHtml(f.paper_title || '未命名') + '</div>' +
                (meta ? '<div class="fav-time">' + escapeHtml(meta) + '</div>' : '') +
                '<div class="fav-time">收藏于 ' + escapeHtml(new Date(f.added_at).toLocaleString()) + '</div></div>' +
                '<button class="icon-btn" data-fav-remove="' + escapeAttr(f.paper_id) + '" title="取消收藏">✕</button>' +
                '</div>';
        }).join('');
    } catch (e) {
        body.innerHTML = '<div class="empty-hint">加载失败</div>';
    }
}

/* 收藏项同样走委托：paper_id 里可能有引号，不能拼进 onclick */
$('favBody').addEventListener('click', function(e) {
    const btn = e.target.closest('[data-fav-remove]');
    if (btn) removeFavorite(btn.dataset.favRemove);
});

async function removeFavorite(pid) {
    try {
        const resp = await fetch('/api/favorites/' + encodeURIComponent(pid), {
            method: 'DELETE', credentials: 'include',
        });
        const data = await resp.json();
        if (!data.success) { toast(data.error || '取消失败'); return; }
        favIds.delete(pid);
        renderFavorites();
        renderResults();
        toast('已取消收藏');
    } catch (e) { toast('取消失败：' + e.message); }
}

async function clearFavorites() {
    if (!confirm('确定清空全部收藏吗？')) return;
    try {
        await fetch('/api/favorites', { method: 'DELETE', credentials: 'include' });
        favIds.clear();
        renderFavorites();
        renderResults();
        toast('已清空收藏');
    } catch (e) { toast('清空失败'); }
}

/* ══════════════════════════════════════════════════════════════
   摘要润色
   ══════════════════════════════════════════════════════════════ */
function togglePolishPanel() {
    const p = $('polishPanel');
    p.style.display = (p.style.display === 'block') ? 'none' : 'block';
    if (p.style.display === 'block') p.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
function closePolishPanel() { $('polishPanel').style.display = 'none'; }

function useAbstractForPolish(idx) {
    const paper = lastPapers[idx];
    if (!paper) return;
    const detail = detailCache[paper.id] || {};
    const abs = detail.abstract || paper.abstract || '';
    if (!abs || abs === '暂无摘要') { toast('这条没有摘要可润色'); return; }
    $('originalAbstract').value = abs;
    $('polishPanel').style.display = 'block';
    $('polishPanel').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

async function polishAbstract() {
    if (requireLogin('摘要润色')) { closePolishPanel(); return; }
    const text = $('originalAbstract').value.trim();
    const box = $('polishedResult');
    if (!text) { box.innerHTML = '<span style="color:#b3243a;">⚠️ 请先粘贴需要润色的摘要</span>'; return; }
    if (text.length < 20) { box.innerHTML = '<span style="color:#b3243a;">⚠️ 摘要太短，至少需要20个字符</span>'; return; }

    box.innerHTML = '<span style="color:#1a5fd0;">⏳ 正在润色…</span>';
    try {
        const resp = await fetch('/api/polish', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ abstract: text, style: $('polishStyle').value }),
            credentials: 'include',
        });
        const data = await resp.json();
        if (data.success) { box.textContent = data.polished; _polished = data.polished; }
        else { box.innerHTML = '<span style="color:#b3243a;">❌ ' + escapeHtml(data.error) + '</span>'; }
    } catch (e) {
        box.innerHTML = '<span style="color:#b3243a;">❌ 网络错误：' + escapeHtml(e.message) + '</span>';
    }
}

function copyPolished() {
    if (!_polished) { toast('还没有润色结果'); return; }
    copyText(_polished, '已复制润色结果');
}

function usePolished() {
    if (!_polished) { toast('还没有润色结果'); return; }
    $('q').value = _polished;
    closePolishPanel();
    $('q').focus();
    toast('已填入搜索框');
}

/* ══════════════════════════════════════════════════════════════
   启动
   ══════════════════════════════════════════════════════════════ */
async function checkLogin() {
    try {
        const resp = await fetch('/api/me', { credentials: 'include' });
        const data = await resp.json();
        if (data.success && data.user) { currentUser = data.user; isLoggedIn = true; }
    } catch (e) { isLoggedIn = false; currentUser = null; }
    updateUserBadge();
    await loadFavoriteIds();
    updateSrcHint();
}

document.addEventListener('click', function(e) {
    if (!$('authDropdown').classList.contains('open')) return;
    if (e.target.closest('.user-menu')) return;
    closeAuthDropdown();
});

/* 详情区内的按钮/下拉走委托（内容每次重渲染，逐个绑定会漏） */
$('results').addEventListener('click', onDetailClick);
$('results').addEventListener('change', onDetailChange);

$('authPromptModal').addEventListener('click', function(e) {
    if (e.target === $('authPromptModal')) closeAuthPrompt();
});

document.addEventListener('keydown', function(e) {
    if (e.key !== 'Escape') return;
    if ($('authPromptModal').classList.contains('show')) { closeAuthPrompt(); return; }
    if ($('favDrawer').classList.contains('open')) { closeFavDrawer(); return; }
    closeAuthDropdown();
});

try {
    const saved = localStorage.getItem('citeStyle');
    if (saved) citeStyle = saved;
} catch (e) { /* 隐私模式忽略 */ }

checkLogin();
$('q').focus();
</script>
</body>
</html>
