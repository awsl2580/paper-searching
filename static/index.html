<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>学术文献检索助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', 'PingFang SC', Roboto, 'Helvetica Neue', sans-serif;
            background: #f0f4f8;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .app-container {
            width: 100%;
            max-width: 900px;
            height: 100vh;
            max-height: 700px;
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }
        .header {
            background: linear-gradient(135deg, #1a2a6c, #2d4373);
            color: white;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .header h1 {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .header h1 span {
            font-weight: 300;
            opacity: 0.8;
        }
        .header-actions {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
        }
        /* ── 用户登录入口（界面左上角） ── */
        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }
        .user-menu {
            position: relative;
        }
        #btnUser {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.12);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 999px;
            padding: 5px 14px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            max-width: 220px;
        }
        #btnUser:hover {
            background: rgba(255, 255, 255, 0.24);
        }
        #btnUser.logged-in {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.55);
        }
        #userBadge {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        #authDropdown {
            display: none;
            position: absolute;
            top: calc(100% + 10px);
            left: 0;
            width: 300px;
            z-index: 300;
            background: white;
            border-radius: 14px;
            padding: 18px 20px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.22);
        }
        #authDropdown.open {
            display: block;
        }
        #authDropdown .auth-box {
            padding: 0;
            max-width: none;
            width: 100%;
            box-shadow: none;
            border-radius: 0;
            background: transparent;
        }
        #authDropdown .auth-box h2 {
            font-size: 18px;
        }
        #authDropdown .auth-box .sub {
            font-size: 13px;
            margin-bottom: 16px;
        }
        #authDropdown .auth-box input {
            padding: 10px 12px;
            font-size: 13px;
            margin-bottom: 10px;
            border-radius: 8px;
        }
        #authDropdown .auth-box .btn-primary {
            padding: 10px;
            font-size: 14px;
            border-radius: 8px;
        }
        .btn {
            padding: 6px 14px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }
        .btn-outline {
            background: transparent;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.15);
        }
        .btn-primary {
            background: #4f7df3;
            color: white;
        }
        .btn-primary:hover {
            background: #3a66d0;
        }
        .btn-sm {
            padding: 4px 12px;
            font-size: 12px;
        }
        .btn-clear {
            background: transparent;
            color: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 12px;
            padding: 4px 12px;
        }
        .btn-clear:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }
        .send:disabled{ opacity:.5; cursor:not-allowed; }

        /* ── 运行中的进度提示（转圈 + 阶段文字 + 已等待秒数） ── */
        .loading-card {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 2px 0;
        }
        .spinner {
            width: 16px;
            height: 16px;
            flex: 0 0 16px;
            border: 2px solid #dbe6fb;
            border-top-color: #4f7df3;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .loading-card .loading-text {
            font-size: 13px;
            color: #4a5568;
        }
        .loading-card .loading-elapsed {
            font-size: 12px;
            color: #9aa5b8;
            font-variant-numeric: tabular-nums;
        }
        .loading-hint {
            margin-top: 8px;
            font-size: 12px;
            color: #9aa5b8;
            line-height: 1.7;
        }
        .thinking-dots {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 0;
        }
        .thinking-dots span {
            width: 8px;
            height: 8px;
            background: #4f7df3;
            border-radius: 50%;
            display: inline-block;
            animation: dot-bounce 1.4s infinite ease-in-out both;
        }
        .thinking-dots span:nth-child(1) { animation-delay: -0.32s; }
        .thinking-dots span:nth-child(2) { animation-delay: -0.16s; }
        .thinking-dots span:nth-child(3) { animation-delay: 0s; }
        @keyframes dot-bounce {
            0%, 80%, 100% {
                transform: scale(0.4);
                opacity: 0.4;
            }
            40% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* 滚动条美化 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        /* #auth-section 现在是左上角浮层里的普通容器，样式由 #authDropdown 接管 */
        .auth-box {
            background: white;
            padding: 40px 48px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 380px;
        }
        .auth-box h2 {
            font-size: 24px;
            margin-bottom: 8px;
            color: #1a2a6c;
        }
        .auth-box .sub {
            color: #888;
            font-size: 14px;
            margin-bottom: 24px;
        }
        .auth-box input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 12px;
            transition: border 0.2s;
            outline: none;
        }
        .auth-box input:focus {
            border-color: #4f7df3;
        }
        .auth-box .btn-primary {
            width: 100%;
            padding: 12px;
            font-size: 15px;
            border-radius: 10px;
        }
        .auth-box .switch-link {
            text-align: center;
            margin-top: 16px;
            font-size: 14px;
            color: #888;
        }
        .auth-box .switch-link a {
            color: #4f7df3;
            cursor: pointer;
            text-decoration: none;
            font-weight: 500;
        }
        .auth-box .switch-link a:hover {
            text-decoration: underline;
        }
        .auth-error {
            color: #e74c5e;
            font-size: 13px;
            margin-bottom: 12px;
            text-align: center;
            min-height: 20px;
        }
        .auth-success {
            color: #27ae60;
            font-size: 13px;
            margin-bottom: 12px;
            text-align: center;
            min-height: 20px;
        }

        #chat-section {
            display: flex;
            flex-direction: row;
            flex: 1;
            min-height: 0;
        }
        #chat-section.hidden {
            display: none;
        }

        /* ── 左侧会话列表 ── */
        #sidebar {
            width: 216px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #eaeef5;
            background: #f8fafd;
            min-height: 0;
        }
        #sidebar.hidden {
            display: none;
        }
        #sidebar .sidebar-head {
            padding: 12px;
            flex-shrink: 0;
        }
        #sidebar .btn-new-chat {
            width: 100%;
            padding: 9px;
            border: 1px dashed #b9c8e4;
            border-radius: 10px;
            background: white;
            color: #1a2a6c;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        #sidebar .btn-new-chat:hover {
            background: #eef3ff;
            border-color: #4f7df3;
        }
        #sidebar .conv-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 8px 12px;
            min-height: 0;
        }
        #sidebar .conv-item {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 10px;
            border-radius: 9px;
            cursor: pointer;
            margin-bottom: 2px;
            transition: background 0.15s;
        }
        #sidebar .conv-item:hover {
            background: #edf2fb;
        }
        #sidebar .conv-item.active {
            background: #e3ecff;
        }
        #sidebar .conv-item .conv-body {
            flex: 1;
            min-width: 0;
        }
        #sidebar .conv-item .conv-title {
            font-size: 13px;
            color: #2b3a55;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #sidebar .conv-item.active .conv-title {
            color: #1a2a6c;
            font-weight: 600;
        }
        #sidebar .conv-item .conv-meta {
            font-size: 11px;
            color: #9aa7bd;
            margin-top: 2px;
        }
        #sidebar .conv-item .btn-del-conv {
            opacity: 0;
            border: none;
            background: none;
            color: #b3bdcd;
            font-size: 13px;
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 6px;
            transition: all 0.15s;
        }
        #sidebar .conv-item:hover .btn-del-conv {
            opacity: 1;
        }
        #sidebar .conv-item .btn-del-conv:hover {
            color: #e74c5e;
            background: #fdecef;
        }
        #sidebar .sidebar-hint {
            padding: 24px 16px;
            font-size: 12px;
            color: #9aa7bd;
            line-height: 1.8;
            text-align: center;
        }
        #sidebar .sidebar-foot {
            flex-shrink: 0;
            padding: 10px 12px;
            border-top: 1px solid #eaeef5;
        }
        #sidebar .btn-clear-convs {
            width: 100%;
            padding: 6px;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: #9aa7bd;
            font-size: 12px;
            cursor: pointer;
        }
        #sidebar .btn-clear-convs:hover {
            background: #fdecef;
            color: #e74c5e;
        }
        .chat-main {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 0;
            min-height: 0;
        }

        .messages {
            flex: 1;
            padding: 20px 24px;
            overflow-y: auto;
            background: #fafcff;
            display: flex;
            flex-direction: column;
        }
        .messages .empty {
            text-align: center;
            color: #aaa;
            font-size: 15px;
            margin-top: 60px;
            line-height: 1.8;
            flex: 1;
        }
        .messages .empty .icon {
            font-size: 48px;
            display: block;
            margin-bottom: 12px;
        }

        .message {
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            max-width: 85%;
            flex-shrink: 0;
        }
        .message.user {
            align-items: flex-end;
            margin-left: auto;
        }
        .message.assistant {
            align-items: flex-start;
        }
        .message .bubble {
            padding: 12px 18px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.7;
            word-break: break-word;
            white-space: pre-wrap;
        }
        .message.user .bubble {
            background: #4f7df3;
            color: white;
            border-bottom-right-radius: 4px;
        }
        .message.assistant .bubble {
            background: #e9edf4;
            color: #1a2a3a;
            border-bottom-left-radius: 4px;
        }
        .message .label {
            font-size: 12px;
            color: #999;
            margin-bottom: 4px;
            padding: 0 4px;
        }
        .message .actions {
            margin-top: 6px;
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .message .actions button {
            padding: 4px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: all 0.2s;
        }
        .message .actions .btn-fav {
            background: #f1c40f;
            color: #1a1a2e;
        }
        .message .actions .btn-fav:hover {
            background: #f39c12;
        }

        /* ── 未登录提示弹窗 ── */
        #authPromptModal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1100;
            justify-content: center;
            align-items: center;
        }
        #authPromptModal.show {
            display: flex;
        }
        #authPromptModal .prompt-content {
            background: white;
            border-radius: 16px;
            padding: 28px 32px;
            max-width: 380px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
            animation: prompt-pop 0.18s ease-out;
        }
        @keyframes prompt-pop {
            from { transform: scale(0.94); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        #authPromptModal .prompt-icon {
            font-size: 40px;
            line-height: 1;
            margin-bottom: 12px;
        }
        #authPromptModal h3 {
            font-size: 18px;
            color: #1a2a6c;
            margin-bottom: 10px;
        }
        #authPromptModal .prompt-text {
            font-size: 14px;
            color: #667085;
            line-height: 1.7;
            margin-bottom: 22px;
        }
        #authPromptModal .prompt-text strong {
            color: #1a2a6c;
        }
        #authPromptModal .prompt-actions {
            display: flex;
            gap: 10px;
        }
        #authPromptModal .prompt-actions button {
            flex: 1;
            padding: 10px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        #authPromptModal .btn-cancel {
            background: #f1f3f7;
            color: #667085;
            border: 1px solid #e3e7ee;
        }
        #authPromptModal .btn-cancel:hover {
            background: #e7eaf1;
        }
        #authPromptModal .btn-go-login {
            background: #4f7df3;
            color: white;
            border: none;
        }
        #authPromptModal .btn-go-login:hover {
            background: #3a66d0;
        }

        #polishPanel {
            display: none;
            padding: 12px 24px;
            background: #f8faff;
            border-bottom: 1px solid #eef2f7;
            flex-shrink: 0;
        }
        #polishPanel .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        #polishPanel .panel-header span {
            font-weight: 600;
            font-size: 15px;
            color: #1a2a6c;
        }
        #polishPanel .panel-header button {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            color: #999;
        }
        #polishPanel .panel-header button:hover {
            color: #333;
        }
        .polish-controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }
        .polish-controls select {
            padding: 8px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 13px;
            outline: none;
        }
        .polish-controls select:focus {
            border-color: #4f7df3;
        }
        .polish-controls .btn-polish {
            padding: 8px 20px;
            background: linear-gradient(135deg, #1a2a6c, #2d4373);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }
        .polish-controls .btn-polish:hover {
            opacity: 0.9;
        }
        .polish-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .polish-grid .label {
            font-size: 13px;
            color: #888;
            margin-bottom: 4px;
        }
        .polish-grid textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 13px;
            resize: vertical;
            outline: none;
            font-family: inherit;
        }
        .polish-grid textarea:focus {
            border-color: #4f7df3;
        }
        .polish-grid .result-box {
            width: 100%;
            min-height: 120px;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #fafcff;
            font-size: 13px;
            line-height: 1.7;
            overflow-y: auto;
            color: #1a2a3a;
            white-space: pre-wrap;
        }
        .polish-grid .result-box .placeholder {
            color: #bbb;
        }
        .polish-actions {
            margin-top: 6px;
            display: flex;
            gap: 8px;
        }
        .polish-actions button {
            padding: 4px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }
        .polish-actions .btn-copy {
            background: #4f7df3;
            color: white;
        }
        .polish-actions .btn-copy:hover {
            background: #3a66d0;
        }
        .polish-actions .btn-send {
            background: #27ae60;
            color: white;
        }
        .polish-actions .btn-send:hover {
            background: #1e8449;
        }

        /* ── 精读文献表（命题核心功能：检索筛选 → 精读清单） ── */
        #tablePanel {
            display: none;
            padding: 12px 24px 16px;
            background: #f8faff;
            border-bottom: 1px solid #eef2f7;
            flex-shrink: 0;
            max-height: 60vh;
            overflow-y: auto;
        }
        #tablePanel .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        #tablePanel .panel-header span {
            font-size: 15px;
            color: #1a2a6c;
        }
        #tablePanel .panel-header button {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            color: #999;
        }
        .table-toolbar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 10px;
        }
        .table-toolbar select,
        .table-toolbar button {
            padding: 6px 12px;
            border: 1px solid #dbe3f0;
            border-radius: 7px;
            font-size: 12.5px;
            background: #fff;
            color: #4a5568;
            cursor: pointer;
            font-family: inherit;
        }
        .table-toolbar button:hover {
            background: #f2f6ff;
            border-color: #b9cdf3;
        }
        .table-toolbar .toolbar-hint {
            font-size: 11.5px;
            color: #9aa5b8;
            margin-left: auto;
        }
        .paper-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12.5px;
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
        }
        .paper-table th {
            background: #f1f5fd;
            color: #54607a;
            font-weight: 600;
            padding: 8px 10px;
            text-align: left;
            white-space: nowrap;
            cursor: pointer;
            user-select: none;
        }
        .paper-table th:hover {
            background: #e8eefb;
        }
        .paper-table td {
            padding: 8px 10px;
            border-top: 1px solid #eef2f7;
            color: #3d4757;
            vertical-align: top;
        }
        .paper-table tr:hover td {
            background: #fafcff;
        }
        .paper-table .col-idx   { width: 34px; color: #9aa5b8; }
        .paper-table .col-score { width: 78px; white-space: nowrap; }
        .paper-table .col-year  { width: 54px; }
        .paper-table .col-full  { width: 76px; white-space: nowrap; }
        .paper-table .t-title   { font-weight: 600; color: #1a2a3a; }
        .paper-table .t-sub     { color: #8a94a6; font-size: 11.5px; margin-top: 2px; }
        .score-pill {
            display: inline-block;
            min-width: 34px;
            text-align: center;
            padding: 2px 6px;
            border-radius: 10px;
            font-size: 11.5px;
            font-weight: 600;
        }
        .score-high { background: #e9f7ef; color: #1e8449; }
        .score-mid  { background: #fff7e6; color: #8a6d1f; }
        .score-low  { background: #f4f5f7; color: #8a94a6; }
        .full-yes { color: #1e8449; font-weight: 600; }
        .full-no  { color: #b6bdc9; }
        .citation-box {
            margin-top: 10px;
            background: #fff;
            border: 1px solid #e3eaf6;
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 12px;
            line-height: 1.9;
            color: #4a5568;
            white-space: pre-wrap;
            max-height: 220px;
            overflow-y: auto;
        }

        .input-area {
            display: flex;
            gap: 12px;
            padding: 16px 24px 20px;
            border-top: 1px solid #eef2f7;

        /* ── 文献来源开关 ── */

        /* ── 论文卡片：结构化结果 + 来源标签 + 每篇独立操作 ── */
        .paper-cards {

<body>

    <div class="app-container" id="app">

        <header class="header">
            <div class="header-left">
                <div class="user-menu">
                    <button class="btn btn-sm" id="btnUser" onclick="toggleAuthDropdown(event)" title="登录 / 注册 / 账号">

                    <div id="authDropdown">
                        <div id="auth-section">
                            <div class="auth-box">
                                <h2 id="authTitle">登录 / 注册</h2>

                                    <a id="authSwitchLink" onclick="toggleAuthMode()">注册</a>
                                </div>
                            </div>
                        </div>

                </div>
                <h1>📚 学术检索 <span>· AI 助手</span></h1>
            </div>

                <button class="btn btn-clear btn-sm" id="btnFavorites" onclick="showFavorites()">⭐ 收藏</button>
                <button class="btn btn-clear btn-sm" id="btnTable" onclick="toggleTablePanel()">📊 文献表</button>
                <button class="btn btn-clear btn-sm" id="btnPolish" onclick="togglePolishPanel()">✍️ 润色</button>

            <!-- 左侧：会话列表（登录后可见） -->

                <div class="sidebar-head">

                    <span class="toolbar-hint" id="tableHint"></span>

                    输入关键词搜索学术论文<br />

    <!-- ===== 未登录提示弹窗 ===== -->
    <div id="authPromptModal">
        <div class="prompt-content">
            <div class="prompt-icon">🔒</div>
            <h3>需要登录</h3>
            <p class="prompt-text">
                <strong id="authPromptFeature">该功能</strong>需要登录后才能使用。<br />
                请点击界面左上角的「👤 未登录」按钮登录或注册。
            </p>
            <div class="prompt-actions">
                <button class="btn-cancel" onclick="closeAuthPrompt()">暂不登录</button>
                <button class="btn-go-login" onclick="goLoginFromPrompt()">立即登录</button>
            </div>
        </div>
    </div>

    <script>
        let isLoggedIn = false;
        let currentUser = null;
        let isRegisterMode = false;
        let messageHistory = [];
        let isProcessing = false;
        let _polishedContent = '';
        let conversations = [];            // 服务端会话列表
        let activeConversationId = null;   // 当前打开的会话 id（null = 全新对话）
        // 文献来源偏好：all=中英文 / en=仅英文 / cn=仅中文，随每次请求带给后端
        let sourcePref = 'all';
        try { sourcePref = localStorage.getItem('sourcePref') || 'all'; } catch (e) { sourcePref = 'all'; }

        const chatSection = document.getElementById('chat-section');
        const authTitle = document.getElementById('authTitle');
        const authSub = document.getElementById('authSub');
        const authError = document.getElementById('authError');
        const authSuccess = document.getElementById('authSuccess');
        const authUsername = document.getElementById('authUsername');
        const authPassword = document.getElementById('authPassword');
        const authConfirmPassword = document.getElementById('authConfirmPassword');
        const authEmail = document.getElementById('authEmail');
        const authSubmitBtn = document.getElementById('authSubmitBtn');
        const authSwitchText = document.getElementById('authSwitchText');
        const authSwitchLink = document.getElementById('authSwitchLink');
        const btnUser = document.getElementById('btnUser');
        const userBadge = document.getElementById('userBadge');
        const authDropdown = document.getElementById('authDropdown');
        const btnLogout = document.getElementById('btnLogout');
        const btnPolish = document.getElementById('btnPolish');
        const btnFavorites = document.getElementById('btnFavorites');
        const sidebar = document.getElementById('sidebar');
        const convList = document.getElementById('convList');
        const sidebarFoot = document.getElementById('sidebarFoot');
        const messagesDiv = document.getElementById('messages');
        const input = document.getElementById('input');
        const sendBtn = document.getElementById('sendBtn');
        const authPromptModal = document.getElementById('authPromptModal');
        const authPromptFeature = document.getElementById('authPromptFeature');
        const polishPanel = document.getElementById('polishPanel');
        const originalAbstract = document.getElementById('originalAbstract');
        const polishedResult = document.getElementById('polishedResult');
        const polishStyle = document.getElementById('polishStyle');
        const sourceSwitch = document.getElementById('sourceSwitch');
        const sourceHint = document.getElementById('sourceHint');

        const EMPTY_STATE_HTML = `
            <div class="empty">
                <span class="icon">🔍</span>
                输入关键词搜索学术论文<br />
                例如：<strong>machine learning</strong> 或 <strong>transformer</strong>
            </div>
        `;

        // 刷新页面后不保留任何对话内容：对话只存在于内存 + 登录后的服务端会话
        function renderHistory() {
            messagesDiv.innerHTML = '';
            if (messageHistory.length === 0) {
                messagesDiv.innerHTML = EMPTY_STATE_HTML;
                return;
            }
            for (const msg of messageHistory) {
                const div = document.createElement('div');
                div.className = `message ${msg.role}`;
                div.innerHTML = `
                    <div class="label">${msg.role === 'user' ? '你' : '助手'}</div>
                    <div class="bubble">${renderRichText(msg.content)}</div>
                `;
                messagesDiv.appendChild(div);
            }
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function resetChatWindow() {
            messageHistory = [];
            activeConversationId = null;
            renderHistory();
            renderConvList();
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        /** HTML 属性值转义（escapeHtml 不处理引号，不能用于属性上下文） */
        function escapeAttr(text) {
            return String(text === undefined || text === null ? '' : text)
                .replace(/&/g, '&amp;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        /** 安全编解码：把任意文本放进 data-* 属性时避免引号/转义问题 */
        function encodeData(text) {
            try {
                return btoa(unescape(encodeURIComponent(String(text))));
            } catch (e) {
                return '';
            }
        }

        function decodeData(text) {
            try {
                return decodeURIComponent(escape(atob(text)));
            } catch (e) {
                return '';
            }
        }

        /**
         * 把一个文本片段转成安全的行内 HTML（粗体、来源标签、换行）。
         * 片段已经被 escapeHtml 转义过，所以这里插入的都是固定标签，不会引入 XSS。
         */
        function inlineMarkup(segment) {
            return escapeHtml(segment)
                .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
                .replace(/【来源：([^】]{1,30})】/g, '<span class="src-inline">来源：$1</span>')
                .replace(/\n/g, '<br>');
        }

        /**
         * 渲染回答正文：把文中的裸 URL 变成可点击链接，顺带处理粗体和来源标签。
         *
         * 关键点：URL 只在**原始文本**上用正则找，href 用 escapeAttr 转义，
         * 其余片段用 escapeHtml 转义 —— 两边都不把未转义内容插进 HTML，
         * 所以模型输出的任何内容都不会变成可执行标记。
         */
        function renderRichText(raw) {
            const text = String(raw == null ? '' : raw);
            const urlRe = /(https?:\/\/[^\s<>"'）)，。；】、*]+)/g;
            let out = '';
            let last = 0;
            let m;
            while ((m = urlRe.exec(text)) !== null) {
                let url = m[1];
                // 去掉被 markdown 或中文标点粘上的尾随符号（**url**、"url。" 等），
                // 否则会生成 href 里带星号/句号的坏链接
                const trail = url.match(/[.,;:!?*_~`）)\]】》"']+$/);
                if (trail) url = url.slice(0, -trail[0].length);
                if (!url || url.length < 12) continue;   // 太短的多半不是真链接，当普通文本
                out += inlineMarkup(text.slice(last, m.index));
                out += '<a class="msg-link" href="' + escapeAttr(url) +
                       '" target="_blank" rel="noopener">' + escapeHtml(url) + '</a>';
                last = m.index + url.length;
            }
            out += inlineMarkup(text.slice(last));
            return out;
        }

        /** 复制文本到剪贴板，成功后在按钮上给个短反馈 */
        async function copyText(text, btn) {
            const flash = function() {
                if (!btn) return;
                const old = btn.textContent;
                btn.textContent = '✓ 已复制';
                setTimeout(function() { btn.textContent = old; }, 1200);
            };
            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(text);
                    flash();
                    return;
                }
                throw new Error('clipboard unavailable');
            } catch (e) {
                // 退回到老办法（http 访问或旧浏览器）
                try {
                    const ta = document.createElement('textarea');
                    ta.value = text;
                    ta.style.position = 'fixed';
                    ta.style.opacity = '0';
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    document.body.removeChild(ta);
                    flash();
                } catch (e2) { /* 复制不了就算了，链接本身是可点的 */ }
            }
        }

        // ============================================================
        //  登录 / 注册（界面左上角入口）
        // ============================================================

        function openAuthDropdown() {
            authDropdown.classList.add('open');
        }

        function closeAuthDropdown() {
            authDropdown.classList.remove('open');
        }

        function toggleAuthDropdown(e) {
            if (e) e.stopPropagation();
            const willOpen = !authDropdown.classList.contains('open');
            if (willOpen) {
                resetAuthForms();
                openAuthDropdown();
            } else {
                closeAuthDropdown();
            }
        }

        function resetAuthForms() {
            authError.textContent = '';
            authSuccess.textContent = '';
            if (isLoggedIn) return;
            // 未登录 -> 重置回登录模式
            isRegisterMode = true;
            toggleAuthMode();
        }

        // ── 未登录提示弹窗 ──
        function showAuthPrompt(feature) {
            authPromptFeature.textContent = feature || '该功能';
            authPromptModal.classList.add('show');
        }

        function closeAuthPrompt() {

        function toggleAuthMode() {
            isRegisterMode = !isRegisterMode;
            if (isRegisterMode) {
                authTitle.textContent = '创建账号';
                authSub.textContent = '注册后即可使用历史记录与收藏';
                authSubmitBtn.textContent = '注册';
                authSwitchText.textContent = '已有账号？';
                authSwitchLink.textContent = '去登录';
                authEmail.style.display = 'block';
                authEmail.placeholder = '邮箱（选填）';
                authConfirmPassword.style.display = 'block';
                authPassword.placeholder = '密码（8-16位，大小写字母+数字组合）';
            } else {
                authTitle.textContent = '登录 / 注册';
                authSub.textContent = '登录后可使用历史记录与收藏';
                authSubmitBtn.textContent = '登录';
                authSwitchText.textContent = '还没有账号？';
                authSwitchLink.textContent = '注册';
                authEmail.style.display = 'none';
                authConfirmPassword.style.display = 'none';
                authPassword.placeholder = '密码';
            }
            authError.textContent = '';
            authSuccess.textContent = '';
        }

        async function handleAuth() {
            const username = authUsername.value.trim();
            const password = authPassword.value.trim();
            const confirmPassword = authConfirmPassword.value.trim();
            const email = authEmail.value.trim();
            authError.textContent = '';
            authSuccess.textContent = '';

            if (!username || !password) {
                authError.textContent = '请填写用户名和密码';
                return;
            }
            if (username.length < 3) {
                authError.textContent = '用户名至少3个字符';
                return;
            }
            if (isRegisterMode) {
                const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,16}$/;
                if (!passwordRegex.test(password)) {
                    authError.textContent = '密码需为8-16位，包含大小写字母和数字';
                    return;
                }
                if (password !== confirmPassword) {
                    authError.textContent = '两次输入的密码不一致';
                    return;
                }
            } else {
                if (password.length < 6) {
                    authError.textContent = '密码至少6个字符';
                    return;
                }
            }

            const endpoint = isRegisterMode ? '/api/register' : '/api/login';
            const body = isRegisterMode ? { username, password, email } : { username, password };

            try {
                const resp = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body),
                    credentials: 'include',
                });
                const data = await resp.json();

                if (data.success) {
                    authSuccess.textContent = data.message || (isRegisterMode ? '注册成功！请登录' : '登录成功！');
                    if (!isRegisterMode) {
                        currentUser = data.user;
                        isLoggedIn = true;
                        authPassword.value = '';
                        updateUserBadge();
                        setTimeout(async () => {
                            messageHistory = [];
                            activeConversationId = null;
                            renderHistory();
                            closeAuthDropdown();
                            await loadConversations();
                        }, 600);
                    } else {
                        setTimeout(() => {
                            isRegisterMode = false;
                            toggleAuthMode();
                            authUsername.value = username;
                            authPassword.value = '';
                            authEmail.value = '';
                            authSuccess.textContent = '注册成功，请登录';
                        }, 1000);
                    }
                } else {
                    authError.textContent = data.error || '操作失败';
                }
            } catch (e) {
                authError.textContent = '网络错误，请检查服务器是否运行';
                console.error(e);
            }
        }

        async function polishAbstract() {
            // 服务端 /api/polish 需要登录，这里提前拦截，避免只报 401
            if (requireLogin('摘要润色')) {
                closePolishPanel();
                return;

            const text = originalAbstract.value.trim();
            const style = polishStyle.value;
            const result = polishedResult;

            if (!text) {
                result.innerHTML = '<span style="color:#e74c5e;">⚠️ 请先粘贴需要润色的摘要</span>';
                return;
            }
            if (text.length < 20) {
                result.innerHTML = '<span style="color:#e74c5e;">⚠️ 摘要太短，至少需要20个字符</span>';
                return;
            }

            result.innerHTML = '<span style="color:#4f7df3;">⏳ 正在润色中，请稍候...</span>';

            try {
                const resp = await fetch('/api/polish', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },

                    credentials: 'include'

        // ============================================================

        // ============================================================
        //  论文卡片（结构化结果）
        // ============================================================

        function paperMetaLine(p) {
            const authors = (p.authors || []);
            const authorText = authors.slice(0, 4).join('、') + (authors.length > 4 ? ' 等' : '');
            return [
                authorText,
                p.year || '',
                p.venue || p.journal || '',
                p.citationCount ? ('被引 ' + p.citationCount) : ''
            ].filter(Boolean).join(' · ');
        }

        /**
         * 渲染一轮检索结果卡片。
         * 数据来自后端 SSE 的 papers 事件（工具返回的原始 JSON），
         * 不再从 Markdown 里正则猜标题 —— 那样只能猜出一篇，也拿不到作者/年份。
         */
        function renderPaperCards(host, papers) {
            if (!host || !papers || !papers.length) return;

            const wrap = document.createElement('div');
            wrap.className = 'paper-cards';

            papers.forEach(function(p, idx) {
                const card = document.createElement('div');
                card.className = 'paper-card';
                card.dataset.paperId = p.id || '';

                const meta = paperMetaLine(p);
                const abstractHtml = (p.abstract && p.abstract !== '暂无摘要')
                    ? '<div class="pc-abstract">' + escapeHtml(p.abstract) + '</div>'
                    : '';

                // 链接分两种，顺序按"我只是想看看"来排：
                //   url           = 来源页/DOI 页 —— HTML 网页，点开就能读，不会下载文件
                //   openAccessPdf = 完整论文的 PDF 直链
                // 全文链接指向**我们自己的代理端点**而不是原站直链：浏览器会忽略
                // 跨域 <a download> 的文件名，只有同源下载才能把文件命名成
                // "年份_第一作者_标题.pdf"（原站给的是 48962-Article Text-... 这种编号）
                const linkRow = function(label, url, fulltext, extra, href) {
                    const cls = fulltext ? ' is-fulltext' : '';
                    return '<div class="pc-link-row">' +
                        '<span class="pc-link-label' + cls + '">' + label + '</span>' +
                        '<a class="pc-link-a' + cls + '" href="' + escapeAttr(href || url) +
                            '" target="_blank" rel="noopener">' + escapeHtml(url) + '</a>' +
                        (extra ? '<span class="pc-link-tag">' + extra + '</span>' : '') +
                        '<button type="button" class="pc-copy" data-copy="' + escapeAttr(url) + '">复制</button>' +
                        '</div>';
                };

                let linksHtml;
                if (p.url || p.openAccessPdf) {
                    const pageLabel = /doi\.org/.test(p.url || '') ? 'DOI 页' : '来源页';
                    // 没有 PDF 直链时别一口咬定"只能看摘要"：
                    // 开放获取（但源没给 pdf_url）的论文，网页里往往就能读全文
                    const noFullNote = p.isOa
                        ? '该源未提供 PDF 直链；这篇属开放获取，网页里可能就能读全文'
                        : '这篇不是开放获取，网页通常只显示摘要';
                    const pdfHref = p.id
                        ? '/api/paper/' + encodeURIComponent(p.id) + '/pdf'
                        : p.openAccessPdf;

                    linksHtml = '<div class="pc-links">' +
                        (p.url ? linkRow('阅读', p.url, false, '网页') : '') +
                        (p.openAccessPdf
                            ? linkRow('全文', p.openAccessPdf, true, '下载', pdfHref)
                            : '') +
                        (!p.openAccessPdf && p.url ? '<div class="pc-link-note">' + noFullNote + '</div>' : '') +
                        '</div>';
                } else {
                    linksHtml = '<div class="pc-links"><div class="pc-link-row">' +
                        '<span class="pc-link-label">链接</span>' +
                        '<span class="pc-nolink">该数据源未提供原文链接</span></div></div>';
                }

                card.innerHTML = `
                    <div class="pc-head">
                        <span class="pc-title">${idx + 1}. ${escapeHtml(p.title || '未知标题')}</span>
                        <span class="src-tag" data-source="${escapeAttr(p.source || '')}">${escapeHtml(p.sourceLabel || p.source || '未知来源')}</span>
                    </div>
                    ${meta ? '<div class="pc-meta">' + escapeHtml(meta) + '</div>' : ''}
                    ${abstractHtml}
                    ${linksHtml}
                    <div class="pc-actions">
                        <button type="button" class="pc-fav">⭐ 收藏</button>
                        <button type="button" class="pc-more">📄 详情</button>
                        <button type="button" class="pc-cite">📋 复制引用</button>
                    </div>
                    <div class="pc-detail" style="display:none;"></div>
                `;

                const detailBox = card.querySelector('.pc-detail');

                // 用闭包绑定，避免把标题/作者塞进 HTML 属性再解码
                card.querySelector('.pc-fav').addEventListener('click', function() {
                    doFavorite(p.id, p.title, (p.authors || []).join('、'), String(p.year || ''), this);
                });

                card.querySelector('.pc-more').addEventListener('click', function() {
                    const showing = detailBox.style.display === 'block';
                    detailBox.style.display = showing ? 'none' : 'block';
                    if (!showing && !card.dataset.detailLoaded) {
                        loadPaperDetail(card, p, detailBox);
                    }
                });

                card.querySelectorAll('.pc-copy').forEach(function(btn) {
                    btn.addEventListener('click', function() {
                        copyText(btn.dataset.copy || '', btn);
                    });
                });

                // 复制引用：用当前在"文献表"里选的格式。
                // 单篇复制不带 [序号]（序号是给整篇参考文献表用的）
                card.querySelector('.pc-cite').addEventListener('click', function() {
                    copyText(formatCitation(p, citeStyle, null), this);
                });

                wrap.appendChild(card);
            });

            host.appendChild(wrap);
        }

        /** 点"详情"时直连后端取数据，不再花一次大模型调用 */
        async function loadPaperDetail(card, paper, box) {
            box.classList.remove('error');
            box.textContent = '加载中...';
            try {
                const resp = await fetch('/api/paper/' + encodeURIComponent(paper.id), {
                    credentials: 'include'
                });
                const data = await resp.json();
                if (!data.success) {
                    box.classList.add('error');
                    box.textContent = '❌ ' + (data.error || '获取详情失败');
                    return;
                }
                const d = data.paper || {};
                const lines = [];
                lines.push('作者：' + ((d.authors || []).join('、') || '未知'));
                lines.push('来源：' + (d.sourceLabel || '') + (d.language ? '（' + d.language + '）' : ''));
                lines.push('年份：' + (d.year || '未知') + (d.venue ? '　期刊/会议：' + d.venue : ''));
                lines.push('被引：' + (d.citationCount || 0)
                    + (typeof d.referenceCount === 'number' ? '　参考文献：' + d.referenceCount : ''));
                if (d.doi) lines.push('DOI：' + d.doi);
                if ((d.fieldsOfStudy || []).length) lines.push('主题：' + d.fieldsOfStudy.join('、'));
                lines.push('全文：' + (d.openAccessPdf
                    ? d.openAccessPdf
                    : '该数据源未提供免费全文（源地址：' + (d.url || '无') + '）'));
                if (d.oaStatus) lines.push('开放获取类型：' + d.oaStatus);
                lines.push('');
                lines.push('摘要：' + (d.abstract || '暂无摘要'));
                box.textContent = lines.join('\n');
                card.dataset.detailLoaded = '1';
            } catch (e) {
                box.classList.add('error');
                box.textContent = '❌ 网络错误：' + e.message;
            }
        }

        // ============================================================
        //  参考文献格式化 + 精读文献表
        //  （对应命题"必须实现的四大核心功能"里的
        //    文献检索筛选 → 精读文献表，以及参考文献自动化格式）
        // ============================================================

        let lastPapers = [];                 // 最近一轮检索结果（文献表的数据源）
        let citeStyle = 'gbt7714';
        let tableSort = { key: 'relevance', desc: true };

        // 文献类型标识：[J]期刊 [C]会议 [D]学位论文 [M]图书 [EB/OL]预印本
        const DOC_MARK = { journal: 'J', conference: 'C', thesis: 'D', book: 'M', preprint: 'EB/OL' };
        const BIB_TYPE = {
            journal: 'article', conference: 'inproceedings', thesis: 'phdthesis',
            book: 'book', preprint: 'misc',
        };

        function docMark(p) {
            return '[' + (DOC_MARK[p.docType] || 'J') + ']';
        }

        /** GB/T 7714 对英文作者要求"姓全大写 + 名缩写"，中文作者原样 */
        function gbtAuthor(name) {
            const s = String(name || '').trim();
            if (!s) return '';
            if (/[\u4e00-\u9fff]/.test(s)) return s.replace(/\s+/g, '');
            const parts = s.split(/\s+/).filter(Boolean);
            if (parts.length === 1) return parts[0].toUpperCase();
            const family = parts[parts.length - 1].toUpperCase();
            // 连字符名（Hong-Bing）按国标缩成 "H B"，而不是只取首字母
            const initials = parts.slice(0, -1).map(function(w) {
                return w.split('-').map(function(x) {
                    return x[0] ? x[0].toUpperCase() : '';
                }).filter(Boolean).join(' ');
            }).join(' ');
            return family + ' ' + initials;
        }

        /** GB/T 7714-2015：3 个以内全列，超过 3 个列前 3 个 + 等 / et al */
        function gbtAuthors(authors) {
            const list = (authors || []).map(gbtAuthor).filter(Boolean);
            if (!list.length) return '佚名';
            if (list.length <= 3) return list.join(', ');
            const isZh = list.some(function(a) { return /[\u4e00-\u9fff]/.test(a); });
            return list.slice(0, 3).join(', ') + (isZh ? ', 等' : ', et al');
        }

        function formatGBT7714(p, idx) {
            const seg = [gbtAuthors(p.authors) + '.'];
            seg.push((p.title || '') + docMark(p) + '.');
            // 期刊名缺失时必须显式标注：否则会拼出 "[J]. 1999, 27: 58-60." 这种塌掉的引用
            // （实测 Semantic Scholar 常不给 venue/journal），[刊名不详] 是国标里的占位写法
            let src = (p.journal || p.venue || '').trim() || '[刊名不详]';
            if (p.year && p.year !== '未知') src += (src ? ', ' : '') + p.year;
            if (p.volume) src += ', ' + p.volume + (p.issue ? '(' + p.issue + ')' : '');
            if (p.pages) src += ': ' + p.pages;
            if (src) seg.push(src + '.');
            if (p.doi) seg.push('DOI: ' + p.doi + '.');
            const text = seg.join(' ').replace(/\s+/g, ' ').trim();
            return (idx === undefined || idx === null) ? text : '[' + (idx + 1) + '] ' + text;
        }

        function apaAuthors(authors) {
            const list = (authors || []).filter(Boolean);
            if (!list.length) return '佚名';
            const names = list.map(function(a) {
                const s = String(a).trim();
                if (/[\u4e00-\u9fff]/.test(s)) return s.replace(/\s+/g, '');
                const parts = s.split(/\s+/).filter(Boolean);
                if (parts.length === 1) return parts[0];
                const family = parts[parts.length - 1];
                const initials = parts.slice(0, -1).map(function(w) {
                    return (w[0] || '').toUpperCase() + '.';
                }).join(' ');
                return family + ', ' + initials;
            });
            if (names.length === 1) return names[0];
            return names.slice(0, -1).join(', ') + ', & ' + names[names.length - 1];
        }

        function formatAPA(p) {
            const year = (p.year && p.year !== '未知') ? p.year : 'n.d.';
            let s = apaAuthors(p.authors) + ' (' + year + '). ' + (p.title || '') + '.';
            const journal = (p.journal || p.venue || '').trim();
            if (journal) {
                s += ' ' + journal;
                if (p.volume) s += ', ' + p.volume;
                if (p.issue) s += '(' + p.issue + ')';
                if (p.pages) s += ', ' + p.pages;
                s += '.';
            } else {
                // 没有刊名（常见于预印本/S2 缺字段）：补占位说明，别让读者以为是排版错误
                s += ' [刊名不详]';
                if (p.pages) s += ' ' + p.pages + '.';
            }
            if (p.doi) s += ' https://doi.org/' + p.doi;
            return s.replace(/\s+/g, ' ').trim();
        }

        function bibtexKey(p, idx) {
            // key 保持纯 ASCII：中文 key 在老版 bibtex 引擎下会直接报错，
            // 而中文姓名没法在不引入拼音库的前提下转写，所以用 cn 前缀 + 年份 + 标题里的 ASCII 词
            const ascii = function(s) { return String(s || '').replace(/[^A-Za-z0-9]/g, ''); };
            const first = String((p.authors || [])[0] || '');
            let fam;
            if (/[\u4e00-\u9fff]/.test(first)) {
                fam = 'cn';
            } else {
                const parts = first.split(/\s+/).filter(Boolean);
                fam = ascii(parts.length ? parts[parts.length - 1] : '');
            }
            const year = (p.year && p.year !== '未知') ? String(p.year) : '';
            const word = ascii(String(p.title || '').replace(/[\u4e00-\u9fff]/g, '')).slice(0, 12);
            const key = fam + year + word;
            return key || ('ref' + ((idx || 0) + 1));
        }

        function formatBibTeX(p, idx, keyOverride) {
            const type = BIB_TYPE[p.docType] || 'article';
            const lines = ['@' + type + '{' + (keyOverride || bibtexKey(p, idx)) + ','];
            const add = function(k, v) {
                if (v) lines.push('  ' + k + ' = {' + String(v).replace(/[{}]/g, '') + '},');
            };
            add('title', p.title);
            add('author', (p.authors || []).join(' and '));
            add('journal', p.journal || p.venue);
            add('year', (p.year && p.year !== '未知') ? p.year : '');
            add('volume', p.volume);
            add('number', p.issue);
            add('pages', p.pages);
            add('doi', p.doi);
            add('url', p.url);
            lines.push('}');
            return lines.join('\n');
        }

        function formatCitation(p, style, idx) {
            if (style === 'apa') return formatAPA(p);
            if (style === 'bibtex') return formatBibTeX(p, idx);
            return formatGBT7714(p, idx);
        }

        function citationList(style) {
            if (!lastPapers.length) return '';
            if (style === 'bibtex') {
                // BibTeX 的 key 必须唯一，否则导入文献管理器时会互相覆盖
                const used = {};
                return lastPapers.map(function(p, i) {
                    let key = bibtexKey(p, i);
                    if (used[key]) {
                        used[key] += 1;
                        key = key + String.fromCharCode(96 + used[key]);   // a, b, c...
                    }
                    used[key] = used[key] || 1;
                    return formatBibTeX(p, i, key);
                }).join('\n\n');
            }
            return lastPapers.map(function(p, i) { return formatCitation(p, style, i); }).join('\n');
        }

        // ── 精读文献表 ─────────────────────────────────────────

        function scoreClass(score) {
            if (score >= 70) return 'score-high';
            if (score >= 40) return 'score-mid';
            return 'score-low';
        }

        function sortedPapers() {
            const key = tableSort.key;
            const arr = lastPapers.slice();
            arr.sort(function(a, b) {
                let x = a[key], y = b[key];
                if (key === 'title') {
                    x = String(x || ''); y = String(y || '');
                    return tableSort.desc ? y.localeCompare(x, 'zh') : x.localeCompare(y, 'zh');
                }
                x = Number(x) || 0;
                y = Number(y) || 0;
                return tableSort.desc ? y - x : x - y;
            });
            return arr;
        }

        function renderPaperTable() {
            const host = document.getElementById('tableBody');
            if (!host) return;

            if (!lastPapers.length) {
                host.innerHTML = '<div class="toolbar-hint">还没有检索结果。先发起一次检索，结果会自动汇总成精读文献表。</div>';
                document.getElementById('citationPreview').textContent = '（选择格式后这里会显示全部引用文本）';
                document.getElementById('tableHint').textContent = '';
                return;
            }

            const sorted = sortedPapers();
            const arrow = tableSort.desc ? ' ↓' : ' ↑';
            const th = function(key, label, cls) {
                return '<th class="' + (cls || '') + '" onclick="sortPaperTable(\'' + key + '\')">' +
                    label + (tableSort.key === key ? arrow : '') + '</th>';
            };

            let html = '<table class="paper-table"><thead><tr>' +
                '<th class="col-idx">#</th>' +
                th('title', '标题') +
                th('relevance', '相关度', 'col-score') +
                th('year', '年份', 'col-year') +
                th('citationCount', '被引') +
                '<th class="col-full">全文</th>' +
                '</tr></thead><tbody>';

            sorted.forEach(function(p, i) {
                const authors = (p.authors || []).slice(0, 3).join('、') +
                    ((p.authors || []).length > 3 ? ' 等' : '');
                const venue = p.journal || p.venue || '';
                const sub = [authors, venue, p.sourceLabel].filter(Boolean).join(' · ');
                const idx = lastPapers.indexOf(p);
                html += '<tr>' +
                    '<td class="col-idx">' + (idx + 1) + '</td>' +
                    '<td><div class="t-title">' + escapeHtml(p.title || '') + '</div>' +
                        '<div class="t-sub">' + escapeHtml(sub) + '</div></td>' +
                    '<td class="col-score"><span class="score-pill ' + scoreClass(p.relevance) + '">' +
                        (p.relevance == null ? '-' : p.relevance) + '</span></td>' +
                    '<td class="col-year">' + escapeHtml(String(p.year || '')) + '</td>' +
                    '<td>' + (p.citationCount || 0) + '</td>' +
                    '<td class="col-full">' + (p.openAccessPdf
                        ? '<span class="full-yes">可获取</span>'
                        : '<span class="full-no">仅摘要</span>') + '</td>' +
                    '</tr>';
            });
            html += '</tbody></table>';
            host.innerHTML = html;

            const withFull = lastPapers.filter(function(p) { return p.openAccessPdf; }).length;
            document.getElementById('tableHint').textContent =
                '共 ' + lastPapers.length + ' 篇，其中 ' + withFull + ' 篇可获取全文';
            document.getElementById('citationPreview').textContent = citationList(citeStyle);
        }

        function sortPaperTable(key) {
            if (tableSort.key === key) {
                tableSort.desc = !tableSort.desc;
            } else {
                tableSort.key = key;
                tableSort.desc = (key !== 'title' && key !== 'year') ? true : false;
                if (key === 'year') tableSort.desc = true;
            }
            renderPaperTable();
        }

        function downloadBlob(text, filename, mime) {
            const blob = new Blob([text], { type: mime || 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
        }

        function csvCell(v) {
            return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
        }

        function exportPapersCsv() {
            if (!lastPapers.length) {
                alert('还没有检索结果');
                return;
            }
            const head = ['序号', '标题', '作者', '年份', '期刊/会议', '来源', '语种',
                          '相关度', '被引', '卷', '期', '页码', 'DOI', '全文可得', '原文链接', '全文链接'];
            const rows = lastPapers.map(function(p, i) {
                return [
                    i + 1, p.title, (p.authors || []).join('、'), p.year,
                    p.journal || p.venue, p.sourceLabel, p.language,
                    p.relevance, p.citationCount, p.volume, p.issue, p.pages,
                    p.doi, p.openAccessPdf ? '是' : '否', p.url, p.openAccessPdf,
                ].map(csvCell).join(',');
            });
            // \ufeff 是 BOM：不加的话 Excel 打开中文会乱码
            downloadBlob('\ufeff' + head.map(csvCell).join(',') + '\n' + rows.join('\n'),
                         '精读文献表.csv', 'text/csv;charset=utf-8');
        }

        function exportCitationsTxt() {
            if (!lastPapers.length) {
                alert('还没有检索结果');

        async function doFavorite(paperId, title, authors, year, btn) {
            if (requireLogin('收藏功能')) return;

            const idForFav = paperId || 'title_' + String(title || '').replace(/[《》\s]/g, '_').substring(0, 50);

            try {
                const checkResp = await fetch(`/api/favorites/${encodeURIComponent(idForFav)}`, {
                    credentials: 'include'
                });
                const checkData = await checkResp.json();

                function syncBtn(faved) {
                    if (!btn) return;
                    btn.classList.toggle('btn-fav-on', faved);
                    btn.textContent = faved ? '⭐ 已收藏' : '⭐ 收藏';
                }

                if (checkData.is_favorited) {
                    const resp = await fetch(`/api/favorites/${encodeURIComponent(idForFav)}`, {
                        method: 'DELETE',
                        credentials: 'include'
                    });
                    const data = await resp.json();
                    if (data.success) {
                        addMessage('assistant', `✅ 已取消收藏：《${title}》`);
                        syncBtn(false);
                    } else {
                        addMessage('assistant', `❌ ${data.error || '取消收藏失败'}`);
                    }
                } else {
                    const resp = await fetch('/api/favorites', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        // 作者/年份来自结构化检索结果，不再写空串
                        body: JSON.stringify({
                            paper_id: idForFav,
                            paper_title: title,
                            authors: authors || '',
                            year: year || ''
                        }),
                        credentials: 'include'
                    });
                    const data = await resp.json();
                    if (data.success) {
                        addMessage('assistant', `✅ 已收藏：《${title}》`);
                        syncBtn(true);
                    } else {
                        addMessage('assistant', `❌ ${data.error || '收藏失败'}`);
                    }
                }
            } catch (e) {
                addMessage('assistant', `❌ 操作失败: ${e.message}`);
            }
        }

        function toggleFavorite(paperId, title, authors, year, btn) {
            if (!title) {
                addMessage('assistant', '❌ 无法收藏：缺少论文标题');
                return;

            doFavorite(paperId, title, authors, year, btn);
        }

        function formatConvTime(value) {
            if (!value) return '';
            // SQLite 可能返回 "2026-09-14 18:20:00.123"（UTC），补成 ISO 再本地化
            const iso = String(value).replace(' ', 'T') + (String(value).includes('Z') ? '' : 'Z');
            const d = new Date(iso);
            return isNaN(d.getTime()) ? '' : d.toLocaleString();
        }

        function renderConvList() {

                sidebar.classList.add('hidden');

        /**
         * 在一轮回答期间显示"程序在跑"的进度提示。
         *
         * 为什么需要：学术接口经常要退避重试，十几秒没有任何输出是常态。
         * 只放三个点的话用户分不清"在检索"还是"已经卡死"。
         * 所以这里同时给出：转圈动画 + 当前阶段文字 + 实时已等待秒数，
         * 超过 6 秒再补一句说明，让人安心等下去。
         */
        function startLoading(bubble) {
            bubble.innerHTML = `
                <div class="loading-card">
                    <span class="spinner"></span>
                    <span class="loading-text">正在思考…</span>
                    <span class="loading-elapsed">0.0s</span>
                </div>
                <div class="loading-hint" style="display:none;">
                    学术检索接口首次响应较慢，通常需要 5–20 秒，请稍候…
                </div>
            `;
            const textEl = bubble.querySelector('.loading-text');
            const elapsedEl = bubble.querySelector('.loading-elapsed');
            const hintEl = bubble.querySelector('.loading-hint');
            const startedAt = Date.now();
            let stopped = false;

            const timer = setInterval(function() {
                if (stopped) return;
                const sec = (Date.now() - startedAt) / 1000;
                if (elapsedEl) elapsedEl.textContent = sec.toFixed(1) + 's';
                if (hintEl && sec > 6 && hintEl.style.display === 'none') {
                    hintEl.style.display = 'block';
                }
            }, 100);

            return {
                status: function(text) {
                    if (!stopped && textEl && text) textEl.textContent = text;
                },
                done: function() {
                    if (stopped) return;
                    stopped = true;
                    clearInterval(timer);
                },
            };
        }

        function extractPapersAndAddFavButtons(content) {
            try {
                const titleMatches = content.matchAll(/\*\*([^*]{5,80})\*\*/g);
                const titles = [];
                for (const match of titleMatches) {
                    const t = match[1].trim();
                    if (t.length > 4 && t.length < 80 &&
                        !t.includes('摘要') && !t.includes('作者') && !t.includes('年份') &&
                        !t.includes('我的收藏') && !t.includes('参考文献')) {
                        titles.push(t);
                    }
                }

                const idMatches = content.matchAll(/paperId[：:]\s*([a-f0-9]{40})/gi);
                const paperIds = [];
                for (const match of idMatches) {
                    paperIds.push(match[1]);
                }

                if (titles.length > 0) {
                    const lastMsg = messagesDiv.querySelector('.message.assistant:last-child');
                    if (lastMsg && !lastMsg.querySelector('.actions')) {
                        const paperTitle = titles[0];
                        const paperId = paperIds.length > 0 ? paperIds[0] : '';

                        const actionsDiv = document.createElement('div');
                        actionsDiv.className = 'actions';
                        actionsDiv.innerHTML = `
                            <button class="btn-fav"
                                data-paper-id="${escapeAttr(encodeData(paperId))}"
                                data-paper-title="${escapeAttr(encodeData(paperTitle))}">
                                ⭐ 收藏此论文
                            </button>
                        `;
                        lastMsg.appendChild(actionsDiv);
                    }
                }
            } catch (e) {
                console.log('收藏按钮解析失败:', e);
            }
        }

        async function sendMessage() {
            if (isProcessing) return;
            const text = input.value.trim();
            if (!text) return;

            // ✅ 检测删除指令：删除 数字
            const deleteMatch = text.match(/^删除\s*(\d+)$/i);
            if (deleteMatch) {
                if (requireLogin('收藏功能')) {
                    input.value = '';
                    return;
                }
                const index = parseInt(deleteMatch[1]);
                await deleteFavoriteByIndex(index);
                input.value = '';
                return;
            }

            // 未登录时对话不落库，刷新即清空；登录后由服务端保存
            addMessage('user', text);
            input.value = '';
            input.style.height = 'auto';
            setLoading(true);

            const placeholder = document.createElement('div');
            placeholder.className = 'message assistant';
            placeholder.innerHTML = `
                <div class="label">助手</div>
                <div class="bubble"></div>
            `;
            messagesDiv.appendChild(placeholder);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;

            // ⚠️ 原来这里写的是 document.getElementById('assistant-bubble')：
            // 每条助手气泡都会带上同一个 id 且从不移除，所以从第二轮开始
            // getElementById 命中的是【第一条】旧气泡 —— 答案被写进了上一条消息，
            // 新气泡永远停在加载动画上，看起来就像卡死。
            // 现在直接持有刚创建的元素引用，不查 DOM。
            const bubble = placeholder.querySelector('.bubble');
            const loader = startLoading(bubble);
            let streamStarted = false;
            let fullContent = '';
            let newConversationId = null;
            let gotCards = false;   // 收到结构化论文卡片后就不再走正则兜底

            try {
                const resp = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: text,
                        history: messageHistory,
                        conversation_id: activeConversationId,
                        source_pref: sourcePref,
                    }),
                    credentials: 'include',
                });

                const reader = resp.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n\n');
                    buffer = lines.pop() || '';

                    for (const line of lines) {
                        if (!line.startsWith('data: ')) continue;
                        try {
                            const data = JSON.parse(line.slice(6));
                            if (data.type === 'token') {
                                if (!streamStarted) { streamStarted = true; loader.done(); }
                                fullContent += data.token;
                                bubble.innerHTML = renderRichText(fullContent);
                                messagesDiv.scrollTop = messagesDiv.scrollHeight;
                            } else if (data.type === 'status') {
                                // 阶段提示：正在思考… / 正在检索文献源… / 正在生成回答…
                                if (!streamStarted) loader.status(data.text);
                            } else if (data.type === 'conversation_id') {
                                newConversationId = data.conversation_id;
                            } else if (data.type === 'papers') {
                                renderPaperCards(placeholder, data.papers);
                                gotCards = true;
                                // 同步喂给"精读文献表"：卡片和表格用的是同一份结构化数据
                                lastPapers = data.papers || [];
                                renderPaperTable();
                                messagesDiv.scrollTop = messagesDiv.scrollHeight;
                            } else if (data.type === 'error') {
                                streamStarted = true;
                                loader.done();
                                bubble.textContent = '❌ ' + data.message;
                            }
                        } catch (e) { /* ignore */ }
                    }
                }

                if (fullContent) {
                    messageHistory.push({ role: 'user', content: text });
                    messageHistory.push({ role: 'assistant', content: fullContent });

                    // 兜底：老格式（没有结构化 cards）时仍按 Markdown 猜一个收藏按钮
                    if (!gotCards) extractPapersAndAddFavButtons(fullContent);
                }

                // 登录用户：服务端已存好这段对话，刷新左侧列表
                if (newConversationId && newConversationId !== activeConversationId) {
                    activeConversationId = newConversationId;
                    await loadConversations();
                } else if (isLoggedIn && activeConversationId) {
                    await loadConversations();
                }

            } catch (e) {
                loader.done();
                streamStarted = true;
                bubble.textContent = '❌ 网络错误: ' + e.message;
            }

            // 收尾：无论如何都要停掉计时器；如果整轮一个 token 都没收到，
            // 也不能把一个转圈的动画永久留在界面上
            loader.done();
            if (!streamStarted) {
                bubble.textContent = '（本轮没有收到回复内容，请重试）';
            }

            setLoading(false);
            input.focus();
        }

        function handleKeydown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        input.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';
        });

        // ============================================================
        //  启动：直接进入对话界面（不恢复任何本地对话内容）
        // ============================================================
        async function checkLogin() {
            try {
                const resp = await fetch('/api/me', { credentials: 'include' });
                const data = await resp.json();
                if (data.success && data.user) {
                    currentUser = data.user;
                    isLoggedIn = true;
                }
            } catch (e) {
                isLoggedIn = false;
                currentUser = null;
            }
            messageHistory = [];
            activeConversationId = null;
            renderHistory();
            showChat();
            await loadConversations();
        }

        // 点击界面其他位置时收起登录浮层
        document.addEventListener('click', function(e) {
            if (!authDropdown.classList.contains('open')) return;
            if (e.target.closest('.user-menu')) return;
            closeAuthDropdown();
        });

        // 点击遮罩关闭未登录提示弹窗
        authPromptModal.addEventListener('click', function(e) {
            if (e.target === authPromptModal) closeAuthPrompt();
        });

        checkLogin();
        setSourcePref(sourcePref);   // 恢复上次选的文献来源
        loadSources();               // 显示当前可用的中文源

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                if (authPromptModal.classList.contains('show')) {
                    closeAuthPrompt();
                    return;
                }
                closeAuthDropdown();
            }
            if (e.key === 'Enter' && !e.shiftKey && document.activeElement === input) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>

</body>
</html>
